<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Woodmont Industrial News Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/utils.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useMemo, useCallback } = React;

    const regions = ["All", "NJ", "PA", "FL"];
    const IS_STATIC = window.location.hostname !== 'localhost';
    const API_BASE = '';

    const Header = ({ timeframe, theme, setTheme }) => {
      const period = (() => {
        const days = parseInt(timeframe, 10);
        if (days === 1) return "Last 24 Hours";
        if (days === 2) return "Last 48 Hours";
        if (days === 3) return "Last 3 Days";
        if (days === 7) return "Last 7 Days";
        if (days === 14) return "Last 14 Days";
        if (days === 30) return "Last 30 Days";
        if (days === 90) return "Last 90 Days";
        if (days === 180) return "Last 6 Months";
        return "All Time";
      })();

      return (
        <header className="relative overflow-hidden">
          <div className={`absolute inset-0 bg-gradient-to-b ${theme === 'dark' ? 'from-[#02060d] via-[#061a33] to-[#0B223F]' : 'from-[#020814] via-[#07203c] to-[#0B223F]'}`}></div>
          <div className="relative px-6 py-10 text-center text-white">
            <div className="flex items-center justify-center gap-6">
              <div>
                <h1 className="text-4xl md:text-5xl font-bold mb-3 tracking-tight drop-shadow-lg">
                  🏢 Woodmont Industrial Partners
                </h1>
                <p className={`text-2xl md:text-3xl font-semibold mb-4 ${theme === 'dark' ? 'text-slate-300' : 'text-blue-100'}`}>
                  Daily Real Estate News Briefing
                </p>
                <div className="flex flex-wrap items-center justify-center gap-3 mt-4">
                  <span className="inline-flex items-center px-4 py-2 rounded-full bg-white/20 backdrop-blur-sm text-base font-medium">
                    📅 {period}
                  </span>
                  <span className="inline-flex items-center px-4 py-2 rounded-full bg-white/20 backdrop-blur-sm text-base font-medium">
                    📍 Focus Markets: <strong className="ml-1">NJ • PA • FL</strong>
                  </span>
                </div>
              </div>
              <button
                onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}
                className="p-3 rounded-xl bg-white/20 backdrop-blur-sm hover:bg-white/30 transition-all text-xl"
                title={`Switch to ${theme === 'light' ? 'dark' : 'light'} theme`}
              >
                {theme === 'light' ? '🌙' : '☀️'}
              </button>
            </div>
          </div>
        </header>
      );
    };

    const FiltersBar = ({ query, setQuery, region, setRegion, source, setSource, category, setCategory, sort, setSort, timeframe, setTimeframe, sources, onRefresh, stats, viewMode, setViewMode, lastFetchInfo, refreshLoading }) => (
      <>
        <div className="max-w-6xl mx-auto px-4 pb-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
          <div className="flex-1 flex gap-3 flex-wrap">
            <input
              className="w-full md:w-80 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-300 dark:focus:ring-blue-600 outline-none text-slate-900 dark:text-white placeholder-slate-500 dark:placeholder-slate-400"
              placeholder="Search title or summary"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
            />
            <select
              className="w-36 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-300 dark:focus:ring-blue-600 outline-none text-slate-900 dark:text-white"
              value={region}
              onChange={(e) => setRegion(e.target.value)}
            >
              {regions.map(r => <option key={r} value={r === "All" ? "" : r}>{r}</option>)}
            </select>
            <select
              className="w-52 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-300 dark:focus:ring-blue-600 outline-none text-slate-900 dark:text-white"
              value={category}
              onChange={(e) => setCategory(e.target.value)}
            >
              <option value="">Category: All</option>
              <option value="relevant">Relevant</option>
              <option value="transactions">Transactions</option>
              <option value="availabilities">Availabilities</option>
              <option value="people">People News</option>
            </select>
            <select
              className="w-44 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-300 dark:focus:ring-blue-600 outline-none text-slate-900 dark:text-white"
              value={source}
              onChange={(e) => setSource(e.target.value)}
            >
              <option value="">Source: All</option>
              {sources.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
            <select
              className="w-32 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-300 dark:focus:ring-blue-600 outline-none text-slate-900 dark:text-white"
              value={sort}
              onChange={(e) => setSort(e.target.value)}
            >
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
            </select>
            <select
              className="w-40 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-300 dark:focus:ring-blue-600 outline-none text-slate-900 dark:text-white"
              value={timeframe}
              onChange={(e) => setTimeframe(e.target.value)}
            >
              <option value="1">Last 24 hours</option>
              <option value="2">Last 48 hours</option>
              <option value="3">Last 3 days</option>
              <option value="7">Last 7 days</option>
              <option value="14">Last 14 days</option>
              <option value="30">Last 30 days</option>
              <option value="90">Last 90 days</option>
            </select>
          </div>
          <div className="flex gap-3 items-center">
            <div className="text-sm text-slate-600 dark:text-slate-400">
              {stats.filtered} of {stats.total} articles • Updated {stats.updated}
            </div>
              <div className="flex gap-2">
              <a
                  href="raw.html"
                  className="px-4 py-2 rounded-xl font-medium transition-all bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-orange-100 dark:hover:bg-orange-900 no-underline"
              >
                  📋 Raw
              </a>
              <button
                  onClick={() => setViewMode(viewMode === "articles" ? "newsletter" : "articles")}
                  className={`px-4 py-2 rounded-xl font-medium transition-all ${
                  viewMode === "articles"
                      ? "bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300"
                      : "bg-[#0B223F] text-white"
                }`}
              >
                  {viewMode === "articles" ? "📧 Newsletter" : "📰 Articles"}
              </button>
              {!IS_STATIC && (
              <button
                  onClick={() => setViewMode(viewMode === "admin" ? "articles" : "admin")}
                  className={`px-4 py-2 rounded-xl font-medium transition-all ${
                    viewMode === "admin"
                      ? "bg-purple-500 text-white"
                      : "bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300"
                  }`}
                >
                  ⚙️ Admin
              </button>
              )}
            </div>
            <button
              onClick={onRefresh}
              disabled={refreshLoading}
              className="px-4 py-2 bg-[#0B223F] text-white rounded-xl font-medium hover:bg-[#16406b] disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-2"
            >
              {refreshLoading ? (
                <>
                  <div className="animate-spin w-4 h-4 border-2 border-white border-t-transparent rounded-full"></div>
                  Refreshing...
                </>
              ) : (
                <>
                  🔄 Refresh
                </>
              )}
            </button>
          </div>
        </div>
        <div className="max-w-6xl mx-auto px-4 pb-4">
          {lastFetchInfo && (
            <div className="bg-slate-50 dark:bg-slate-800 rounded-lg p-3 text-sm border border-slate-200 dark:border-slate-700">
              <div className="flex items-center gap-4 flex-wrap">
                <div className="flex items-center gap-2">
                  <span className="text-slate-600 dark:text-slate-400">Last fetched:</span>
                  <span className="font-medium text-slate-900 dark:text-slate-100">
                    {lastFetchInfo.timestamp ? new Date(lastFetchInfo.timestamp).toLocaleString() : 'Never'}
                  </span>
                </div>
                <div className="flex items-center gap-3">
                  <span className="flex items-center gap-1">
                    <span className="w-2 h-2 bg-[#0B223F] rounded-full"></span>
                    <span className="text-blue-600 font-medium">{lastFetchInfo.totalFetched || lastFetchInfo.fetched || 0}</span>
                    <span className="text-slate-600 dark:text-slate-400">fetched</span>
                  </span>
                  <span className="flex items-center gap-1">
                    <span className="w-2 h-2 bg-[#0B223F] rounded-full"></span>
                    <span className="text-blue-600 font-medium">{lastFetchInfo.totalKept || lastFetchInfo.kept || 0}</span>
                    <span className="text-slate-600 dark:text-slate-400">kept</span>
                  </span>
                  <span className="flex items-center gap-1">
                    <span className="w-2 h-2 bg-purple-500 rounded-full"></span>
                    <span className="text-purple-600 font-medium">{lastFetchInfo.sourcesProcessed || lastFetchInfo.sources || 0}</span>
                    <span className="text-slate-600 dark:text-slate-400">sources</span>
                  </span>
                </div>
                {lastFetchInfo && (lastFetchInfo.lastArticle || lastFetchInfo.latestTitle) && (
                  <div className="flex items-center gap-2 ml-auto">
                    <span className="text-slate-600 dark:text-slate-400">Latest:</span>
                    <span className="font-medium text-slate-900 dark:text-slate-100 max-w-xs truncate" title={lastFetchInfo.lastArticle?.title || lastFetchInfo.latestTitle}>
                      {lastFetchInfo.lastArticle?.title || lastFetchInfo.latestTitle || 'N/A'}
                    </span>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      </>
    );

    // Placeholder images - from external utils.js
    const { getPlaceholderImage } = window.WoodmontUtils;

    const ArticleCard = ({ item, onClick, trackedMatches = [], onTrackKeyword, onIgnoreArticle, onSendToRaw, onAddToNewsletter, onRemoveFromNewsletter }) => {
      const category = item.category || 'relevant';
      const fallback = getPlaceholderImage(category, item.title);
      const [imgSrc, setImgSrc] = useState(item.image || fallback);
      const [imgError, setImgError] = useState(false);

      const published = item.pubDate ? new Date(item.pubDate) : null;
      const isValidDate = published && !isNaN(published.getTime());
      const isTracked = trackedMatches.length > 0;
      const suggestedKeywords = extractTrackableKeywords(item);

      // Quick track - uses first suggested keyword or source
      const quickTrack = () => {
        const keyword = suggestedKeywords[0] || item.source || item.title?.split(' ').slice(0, 2).join(' ');
        if (keyword) {
          onTrackKeyword && onTrackKeyword(keyword, item.title);
        }
      };

      // Quick ignore - ignores THIS SPECIFIC ARTICLE only with multiple choice
      const [showMoreMenu, setShowMoreMenu] = useState(false);
      const ignoreReasons = [
        { label: 'Not Relevant', value: 'not_relevant' },
        { label: 'Wrong Region', value: 'wrong_region' },
        { label: 'Duplicate', value: 'duplicate' },
        { label: 'Old News', value: 'old_news' },
        { label: 'Not CRE Related', value: 'not_cre' },
        { label: 'Other', value: 'other' }
      ];

      const handleIgnoreWithReason = (reason) => {
        setShowMoreMenu(false);
        onIgnoreArticle && onIgnoreArticle(item, reason);
      };

      // Category colors for branded overlay
      const categoryColors = {
        transactions: 'from-amber-600/80',
        availabilities: 'from-[#16406b]/80',
        people: 'from-purple-600/80',
        relevant: 'from-slate-700/80'
      };

      return (
        <article
          className={`card-anim bg-white dark:bg-slate-800 rounded-2xl overflow-hidden flex flex-col h-full focus-within:ring-2 focus-within:ring-blue-400 dark:focus-within:ring-blue-600 cursor-pointer ${isTracked ? 'tracked-highlight' : ''}`}
          onClick={(e) => {
            // Don't trigger onClick if clicking the track menu
            if (!e.target.closest('.track-menu-container')) {
              onClick && onClick(item);
            }
          }}
        >
          <div className="relative aspect-video bg-slate-200 dark:bg-slate-900 overflow-hidden">
            <img
              src={imgError ? fallback : (imgSrc || fallback)}
              alt={item.title || 'Article image'}
              className="img-anim w-full h-full object-cover"
              loading="lazy"
              onError={() => {
                setImgError(true);
                setImgSrc(fallback);
              }}
            />
            {/* Gradient overlay with category color */}
            <div className={`absolute inset-0 bg-gradient-to-t ${categoryColors[category] || categoryColors.relevant} via-transparent to-transparent pointer-events-none`}></div>
            <div className="absolute top-3 left-3 flex gap-2 flex-wrap">
              <span className="bg-white/90 dark:bg-slate-800/90 text-slate-900 dark:text-slate-100 text-xs font-semibold px-3 py-1.5 rounded-lg shadow-sm uppercase tracking-wide">
                {(() => {
                  // Prefer the resolved publisher; if that still has "Google News" prefix, strip it.
                  let src = item.source || item.publisher;
                  if (!src) src = (typeof getPublisherName === 'function') ? getPublisherName(item) : 'Source';
                  if (typeof src !== 'string') src = src.name || 'Source';
                  return src.replace(/^google\s+news\s+/i, '').trim() || 'Source';
                })()}
              </span>
              {/* Author chip suppressed when it duplicates the source or is a Google News feed name */}
              {item.author && (() => {
                const authorStr = typeof item.author === 'string' ? item.author : (item.author.name || '');
                if (!authorStr || /^google\s+news/i.test(authorStr)) return null;
                const srcStr = (item.source || item.publisher || '').toString();
                if (srcStr && authorStr.toLowerCase() === srcStr.toLowerCase()) return null;
                return (
                  <span className="bg-[#0B223F]/90 text-white text-xs font-medium px-3 py-1.5 rounded-lg shadow-sm">
                    By {authorStr}
                  </span>
                );
              })()}
            </div>
          </div>
          <div className="p-4 flex flex-col gap-3 flex-1">
            <div className="flex items-center gap-2 flex-wrap text-xs text-slate-600 dark:text-slate-400">
              {isValidDate && <span>{published.toLocaleDateString()}</span>}
              {item.category && (
                <span className={`px-2 py-1 rounded-full text-xs font-medium ${
                  item.category === 'transactions' ? 'bg-amber-100 dark:bg-amber-900/60 text-amber-800 dark:text-amber-300' :
                  item.category === 'availabilities' ? 'bg-blue-100 dark:bg-amber-900/60 text-blue-800 dark:text-amber-300' :
                  item.category === 'people' ? 'bg-purple-100 dark:bg-amber-900/60 text-purple-800 dark:text-amber-300' :
                  'bg-slate-100 dark:bg-amber-900/60 text-slate-800 dark:text-amber-300'
                }`}>
                  {item.category === 'transactions' ? 'Transactions' :
                   item.category === 'availabilities' ? 'Availabilities' :
                   item.category === 'people' ? 'People News' :
                   'Relevant'}
                </span>
              )}
              {/* Debug badges (?debug=1): predicted-publish reason + source tier + Woodmont LLM verdict */}
              {(() => {
                if (typeof window === 'undefined') return null;
                const isDebug = new URLSearchParams(window.location.search).get('debug') === '1';
                if (!isDebug) return null;
                const reason = item._predictedReason || item._classificationReason || '';
                const tier = item._tier || '';
                const willPublish = item._predictedPublish === true;
                const reasonColor = willPublish
                  ? 'bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-200'
                  : reason.startsWith('REJECT') || reason === 'EXCLUDED'
                    ? 'bg-red-100 text-red-800 dark:bg-red-900/60 dark:text-red-200'
                    : 'bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-200';
                // Woodmont LLM second-pass verdict
                const wmApprove = item._woodmontApprove;
                const wmReason = item._woodmontReason || '';
                const wmConf = item._woodmontConfidence;
                const wmClass = item._woodmontClassifier || '';
                const wmColor = wmApprove === true
                  ? 'bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-200'
                  : wmApprove === false
                    ? 'bg-red-100 text-red-800 dark:bg-red-900/60 dark:text-red-200'
                    : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400';
                return (
                  <>
                    {reason && (
                      <span className={`px-2 py-1 rounded-full text-xs font-medium ${reasonColor}`} title={`_predictedReason: ${reason}`}>
                        {reason}
                      </span>
                    )}
                    {tier && (
                      <span className="px-2 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300" title={`source tier ${tier}`}>
                        tier {tier}
                      </span>
                    )}
                    {wmApprove !== null && wmApprove !== undefined && (
                      <span
                        className={`px-2 py-1 rounded-full text-xs font-medium ${wmColor}`}
                        title={`Woodmont LLM (${wmClass || 'unknown'}, confidence ${wmConf ?? '?'}): ${wmReason}`}
                      >
                        {wmApprove ? 'LLM ✓' : 'LLM ✗'}{typeof wmConf === 'number' ? ` ${wmConf}` : ''}
                      </span>
                    )}
                  </>
                );
              })()}
            </div>
            <h3 className="text-lg font-semibold text-slate-900 dark:text-slate-100 leading-tight clamp-2">
              <a
                href={item.link}
                target="_blank"
                rel="noopener noreferrer"
                className="hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
              >
                {item.title}
              </a>
            </h3>
            {item.description && (
              <p className="text-sm text-slate-600 dark:text-slate-400 clamp-3 flex-1 leading-relaxed">
                {item.description}
              </p>
            )}
            <div className="mt-auto pt-3 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between">
              <a
                href={item.link}
                target="_blank"
                rel="noopener noreferrer"
                className="inline-flex items-center gap-2 text-sm font-semibold text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 transition-colors"
                onClick={(e) => e.stopPropagation()}
              >
                Read more →
              </a>

              {/* Action Buttons — +/- prominent, everything else under ⋯ */}
              <div className="track-menu-container relative flex items-center gap-1.5">
                {/* Add to Newsletter */}
                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    onAddToNewsletter && onAddToNewsletter(item);
                  }}
                  className="w-8 h-8 flex items-center justify-center rounded-lg text-lg leading-none font-bold text-white bg-gradient-to-b from-[#16406b] to-[#0B223F] border border-blue-900/50 shadow-sm hover:from-[#1e5a94] hover:to-[#16406b] hover:shadow-md active:scale-95 transition-all cursor-pointer"
                  title="Add this article to the next newsletter"
                >
                  +
                </button>

                {/* Remove from Newsletter */}
                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    onRemoveFromNewsletter && onRemoveFromNewsletter(item);
                  }}
                  className="w-8 h-8 flex items-center justify-center rounded-lg text-lg leading-none font-bold text-white bg-gradient-to-b from-rose-500 to-rose-700 border border-rose-800/50 shadow-sm hover:from-rose-400 hover:to-rose-600 hover:shadow-md active:scale-95 transition-all cursor-pointer"
                  title="Exclude this article from the newsletter"
                >
                  &minus;
                </button>

                {/* More menu: Track / Raw / Ignore */}
                <div className="relative">
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      e.preventDefault();
                      setShowMoreMenu(!showMoreMenu);
                    }}
                    className={`w-8 h-8 flex items-center justify-center rounded-lg text-lg leading-none font-bold shadow-sm active:scale-95 transition-all cursor-pointer border ${
                      isTracked
                        ? 'text-white bg-gradient-to-b from-[#16406b] to-[#0B223F] border-blue-900/50'
                        : 'text-slate-100 bg-gradient-to-b from-slate-600 to-slate-800 border-slate-900/50 hover:from-slate-500 hover:to-slate-700 hover:text-white hover:shadow-md'
                    }`}
                    title="More actions"
                  >
                    ⋯
                  </button>

                  {showMoreMenu && (
                    <div className="absolute right-0 bottom-full mb-2 w-52 bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-600 z-50 overflow-hidden">
                      <div className="py-1">
                        {/* Track */}
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            e.preventDefault();
                            if (!isTracked) quickTrack();
                            setShowMoreMenu(false);
                          }}
                          disabled={isTracked}
                          className={`w-full text-left px-4 py-2.5 text-sm font-medium transition-colors ${
                            isTracked
                              ? 'text-blue-600 dark:text-blue-400 cursor-default'
                              : 'text-slate-700 dark:text-slate-200 hover:bg-blue-50 dark:hover:bg-blue-900/30 hover:text-blue-700 dark:hover:text-blue-300'
                          }`}
                        >
                          {isTracked ? '★ Tracking topic' : '☆ Track this topic'}
                        </button>

                        {/* Send to Raw */}
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            e.preventDefault();
                            onSendToRaw && onSendToRaw(item);
                            setShowMoreMenu(false);
                          }}
                          className="w-full text-left px-4 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-amber-50 dark:hover:bg-amber-900/30 hover:text-amber-700 dark:hover:text-amber-400 transition-colors"
                        >
                          &rarr; Send to Raw picks
                        </button>

                        <div className="border-t border-slate-100 dark:border-slate-700 my-1"></div>

                        <div className="px-4 py-1.5 text-xs font-semibold uppercase tracking-wide text-slate-400 dark:text-slate-500">
                          Ignore &mdash; why?
                        </div>
                        {ignoreReasons.map((reason) => (
                          <button
                            key={reason.value}
                            onClick={(e) => {
                              e.stopPropagation();
                              e.preventDefault();
                              handleIgnoreWithReason(reason.label);
                            }}
                            className="w-full text-left px-4 py-2 text-sm text-slate-600 dark:text-slate-300 hover:bg-red-50 dark:hover:bg-red-900/30 hover:text-red-600 dark:hover:text-red-400 transition-colors"
                          >
                            {reason.label}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

              </div>
            </div>
          </div>
        </article>
      );
    };

                                <span className="text-sm font-medium text-red-700 dark:text-red-300">{topic.keyword}</span>

                                  ×
                                </button>
                              </div>

                  )}
                </>
              )}

              {activeTab === 'settings' && (
                <div className="space-y-3">
                  {/* User Identity */}
                  <div className="pb-3 border-b border-slate-200 dark:border-slate-700">
                    <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                      Who are you?
                      {currentUser && <span className="ml-2 text-blue-500 text-xs font-normal">● {currentUser}</span>}
                    </label>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mb-2">
                      Your preferences (tracked topics, ignored articles) are stored per user and synced to GitHub.
                    </p>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        value={userInput}
                        onChange={(e) => setUserInput(e.target.value)}
                        onKeyPress={(e) => {
                          if (e.key === 'Enter') {
                            const name = userInput.trim().toLowerCase();
                            if (name) { setUserId(name); onUserChange && onUserChange(name); }
                          }
                        }}
                        placeholder="Enter your name..."
                        className="flex-1 px-3 py-2 text-sm border border-slate-200 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-300 outline-none"
                      />
                      <button
                        onClick={() => {
                          const name = userInput.trim().toLowerCase();
                          if (name) { setUserId(name); onUserChange && onUserChange(name); }

                    {currentUser && (

                  <div>
                    <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">

                    <p className="text-xs text-slate-500 dark:text-slate-400 mb-2">

                      Paste it per session, then click Connect. Use a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer" className="text-blue-500 hover:underline">fine-grained personal access token</a> scoped to only the Woodmont-Industrial-News-Briefing repo with
                      "Contents: Read and write" permission and the shortest practical expiration.
                    </p>
                    <div className="flex gap-2">
                      <input
                        type="password"
                        value={ghToken}
                        onChange={(e) => { setGhToken(e.target.value); setTokenSaved(false); }}
                        placeholder="github_pat_..."
                        className="flex-1 px-3 py-2 text-sm border border-slate-200 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-300 outline-none font-mono"
                      />
                      <button
                        onClick={() => {

                        className="px-4 py-2 bg-[#0B223F] text-white rounded-lg text-sm font-medium hover:bg-[#16406b] transition-colors"
                      >
                        {tokenSaved ? 'Connected!' : 'Connect'}
                      </button>
                      {ghToken && (
                        <button
                          onClick={() => { setGitHubToken(''); setGhToken(''); }}
                          className="px-3 py-2 bg-red-100 text-red-600 rounded-lg text-sm font-medium hover:bg-red-200 transition-colors"
                        >
                          Clear
                        </button>
                      )}
                    </div>
                  </div>
                  {tokenWarning && (
                    <div className="rounded-lg border border-amber-300 bg-amber-50 dark:bg-amber-900/20 dark:border-amber-700 p-3 text-xs text-amber-800 dark:text-amber-200">
                      GitHub token missing for this session. Paste your token and click Connect to enable repo sync actions.
                    </div>
                  )}
                  <div className="bg-slate-50 dark:bg-slate-700/50 rounded-lg p-3 text-xs text-slate-500 dark:text-slate-400">
                    <p className="font-medium text-slate-600 dark:text-slate-300 mb-1">How it works:</p>
                    <p>When you click "Ignore" or make raw-feed picks, repo sync runs only if a token is connected in this tab. Reloading the page clears the token, and you must paste it again for that session.</p>
                  </div>
                </div>
              )}

              <p className="text-xs text-slate-400 mt-3">
                Preferences are stored {currentUser ? ('for ' + currentUser + ' on the server') : 'in your browser'}{ghToken ? ' and synced to GitHub' : ''}. Tracked articles are highlighted, ignored articles are hidden.
              </p>
            </div>
          )}
        </div>
      );
    };

    const NewsletterPreview = ({ html, loading, timeframe, setTimeframe, theme, setTheme, darkMode, onGenerate, onClear, generated, newsletterRecipients, setNewsletterRecipients, onSendEmail, emailLoading, feedHealthReport, showFeedHealth, setShowFeedHealth, onFetchFeedHealth, feedHealthLoading, cmAsOfDate, setCmAsOfDate, cmLookback, setCmLookback, cmWatchlist, setCmWatchlist }) => {
      const [showTemplate, setShowTemplate] = useState(false);
      const [sendingEmail, setSendingEmail] = useState(false);

      // Article Preview Panel state (Phase 1)
      const [previewArticles, setPreviewArticles] = useState(null);
      const [removedIds, setRemovedIds] = useState(new Set());
      const [filters, setFilters] = useState({ region: true, industrial: true, dedup: true });
      const [showArticlePanel, setShowArticlePanel] = useState(false);
      const [articlePanelLoading, setArticlePanelLoading] = useState(false);

      // Feedback state (Phase 2)
      const [articleFeedback, setArticleFeedback] = useState({}); // {articleId: {action: 'approved'|'rejected', reason: null|string}}
      const [showRejectMenu, setShowRejectMenu] = useState(null); // articleId of currently shown reject menu

      // Publisher / journal name extraction. Mirrors src/shared/publisher-name.ts
      // so SPA labels match what the newsletter shows. Three strategies:
      //   1. Trailing-dash in title (Google News pattern: "...- WSVN")
      //   2. Domain map for direct sources (re-nj.com → "Real Estate NJ")
      //   3. Strip "Google News " prefix from feed names

      // HTML-escape helpers (mirror src/shared/html-escape.ts). Used by the
      // 3 newsletter preview builders below. Without these, an RSS title with an
      // injected script tag (angle-bracket-script ... angle-bracket-slash-script)
      // would render verbatim into the SPA preview DOM and execute. The SPA
      // is plain JS in a browser → XSS is real here (not just theoretical
      // like in the email path where clients sanitize).
      const HTML_ESCAPE_MAP = {
        '&': '&amp;', '<': '&lt;', '>': '&gt;',
        '"': '&quot;', "'": '&#39;', '`': '&#96;', '/': '&#47;'
      };
      const escapeHtml = (text) => {
        if (text === null || text === undefined) return '';
        return String(text).replace(/[&<>"'`\/]/g, ch => HTML_ESCAPE_MAP[ch] || ch);
      };
      const escapeAttr = escapeHtml;
      const safeUrl = (url) => {
        if (!url) return '#';
        const s = String(url).trim();
        if (!s) return '#';
        if (/^\s*(javascript|data|vbscript|file):/i.test(s)) return '#';
        try {
          const u = new URL(s);
          return (u.protocol === 'http:' || u.protocol === 'https:') ? s : '#';
        } catch { return '#'; }
      };

      const PUBLISHER_DOMAIN_MAP = {
        're-nj.com': 'Real Estate NJ', 'roi-nj.com': 'ROI-NJ', 'njbiz.com': 'NJBIZ',
        'realestatenjmag.com': 'Real Estate NJ Magazine', 'njspotlightnews.org': 'NJ Spotlight News', 'nj.com': 'NJ.com',
        'lvb.com': 'Lehigh Valley Business', 'philly.com': 'Philly.com',
        'sun-sentinel.com': 'Sun Sentinel', 'miamiherald.com': 'Miami Herald',
        'tampabay.com': 'Tampa Bay Times', 'jacksonville.com': 'The Florida Times-Union',
        'globest.com': 'GlobeSt', 'bisnow.com': 'Bisnow', 'commercialobserver.com': 'Commercial Observer',
        'costar.com': 'CoStar', 'connectcre.com': 'Connect CRE', 'rebusinessonline.com': 'REBusiness Online',
        'commercialsearch.com': 'CommercialSearch', 'commercialcafe.com': 'CommercialCafe', 'credaily.com': 'CRE Daily',
        'cpexecutive.com': 'CPE', 'therealdeal.com': 'The Real Deal',
        'naiop.org': 'NAIOP', 'supplychaindive.com': 'Supply Chain Dive', 'supplychainbrain.com': 'SupplyChainBrain',
        'mhlnews.com': 'MHL News', 'areadevelopment.com': 'Area Development', 'bizjournals.com': 'The Business Journals',
        'prnewswire.com': 'PR Newswire', 'businesswire.com': 'BusinessWire',
        'wsj.com': 'WSJ', 'bloomberg.com': 'Bloomberg', 'reuters.com': 'Reuters', 'prologis.com': 'Prologis',
      };
      // Mirrors src/shared/publisher-name.ts getPublisherName (keep in sync).
      const looksLikeDomain = (s) => s.length <= 60 && !/\s/.test(s) && /^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9-]+)+$/i.test(s);
      const domainPublisher = (domain) => {
        const host = domain.toLowerCase().replace(/^www\./, '');
        if (host === 'news.google.com') return 'Google News';
        for (const d of Object.keys(PUBLISHER_DOMAIN_MAP)) { if (host === d || host.endsWith('.' + d)) return PUBLISHER_DOMAIN_MAP[d]; }
        return host;
      };
      const getPublisherName = (article) => {
        if (!article) return 'Source';
        const title = article.title || article.t || '';
        const segs = title.split(/\s+[-–—|]\s+/);
        if (segs.length >= 2) {
          const last = segs[segs.length - 1].trim();
          if (/^[A-Z]/.test(last) && last.length >= 2 && last.length <= 60) return last;
          if (looksLikeDomain(last)) return domainPublisher(last);
        }
        const sf = ((article._source && article._source.name) || (article._source && article._source.website) || article.source || article.s || '').toLowerCase();
        const url = (article.url || article.link || article.u || '').toLowerCase();
        const hay = sf + ' ' + url;
        for (const d of Object.keys(PUBLISHER_DOMAIN_MAP)) { if (hay.includes(d)) return PUBLISHER_DOMAIN_MAP[d]; }
        if (/^google news\b/i.test(sf)) {
          const stripped = sf.replace(/^google news\s+/i, '').trim();
          return stripped.split(/\s+/).map(w => /^[a-z]{2,3}$/.test(w) || /^[A-Z]{2,}(-[A-Z]+)?$/.test(w) ? w.toUpperCase() : w[0].toUpperCase() + w.slice(1)).join(' ').trim();
        }
        if (sf === 'news.google.com' || /news\.google\.com/.test(url)) return 'Google News';
        if (article._source && article._source.name) return article._source.name;
        return article.source || article.s || 'Source';
      };

      // Region detection from title/description text
      const detectRegion = useCallback((text) => {
        if (!text) return null;
        const t = text.toLowerCase();
        // NJ indicators
        if (/\b(new jersey|newark|jersey city|edison|elizabeth|secaucus|cranbury|east brunswick|carteret|linden|woodbridge|parsippany|meadowlands|bergen|passaic|middlesex|monmouth|somerset|morris county|i-95 corridor nj|exit \d+ turnpike|nj turnpike|route 1 corridor)\b/.test(t)) return 'NJ';
        // PA indicators
        if (/\b(pennsylvania|philadelphia|lehigh valley|allentown|bethlehem|easton|harrisburg|lancaster|bucks county|montgomery county|chester county|delaware county|king of prussia|i-78 corridor|pa turnpike|lehigh county)\b/.test(t)) return 'PA';
        // FL indicators
        if (/\b(florida|miami|fort lauderdale|hialeah|doral|pompano|palm beach|broward|miami-dade|orlando|tampa|jacksonville|south florida|central florida|i-4 corridor|homestead|medley|opa-locka|coral springs)\b/.test(t)) return 'FL';
        return null;
      }, []);

      // Simple industrial relevance check
      const isLikelyIndustrial = useCallback((text) => {
        if (!text) return true; // assume relevant if no text
        const t = text.toLowerCase();
        const industrialTerms = /\b(warehouse|industrial|logistics|distribution|fulfillment|cold storage|last[ -]mile|manufacturing|flex space|truck terminal|cross[ -]dock|supply chain|freight|3pl|data center|speculative development|spec dev|bulk warehouse)\b/;
        const nonIndustrialTerms = /\b(retail|restaurant|hotel|hospitality|multifamily|apartment|condo|residential|office lease|coworking|medical office|senior living|student housing|wine bar|brewery|spa|salon|gym|fitness|yoga|art gallery|museum|theater|concert|festival|parade)\b/;
        if (nonIndustrialTerms.test(t) && !industrialTerms.test(t)) return false;
        return true;
      }, []);

      // Normalize title for dedup. Strip ANY trailing " - Publisher" suffix
      // (Google News pattern) so "$100M ... - Yahoo Finance" and
      // "$100M ... - NJ.com" collapse to the same normalized form.
      const normalizeForDedup = useCallback((title) => {
        if (!title) return '';
        return title.toLowerCase()
          // Strip generic trailing publisher suffix: " - Foo Bar" (Google News style)
          .replace(/\s+[-–—|]\s+[a-z0-9 .&'-]{1,50}$/i, '')
          // Also strip "N.J." / "Monmouth County" variants so cross-source dupes collapse
          .replace(/\bn\.j\.|new jersey\b/gi, 'nj')
          .replace(/\bmonmouth county|monmouth\b/gi, 'monmouth')
          .replace(/[^a-z0-9\s]/g, '')
          .replace(/\s+/g, ' ')
          .trim();
      }, []);

      // Fetch and process articles for preview panel
      const loadPreviewArticles = useCallback(async () => {
        setArticlePanelLoading(true);
        try {
          const res = await fetch('feed.json');
          if (!res.ok) throw new Error('Failed to fetch feed.json');
          const data = await res.json();
          const rawItems = data.items || [];

          // Parse into a simple format
          const articles = rawItems.map(item => {
            let authorName = '';
            if (item.author) {
              authorName = typeof item.author === 'string' ? item.author : (item.author.name || '');
            }
            // Use shared publisher resolver so badge shows "CoStar" not "Google News CoStar Industrial".
            const sourceName = getPublisherName(item) || authorName || 'Unknown';
            const title = item.title || 'Untitled';
            const description = item.content_text || item.content_html || item.summary || '';
            const combinedText = title + ' ' + description;
            const region = detectRegion(combinedText);
            const industrial = isLikelyIndustrial(combinedText);

            return {
              id: item.id,
              title,
              url: item.url || '',
              description: description.substring(0, 200),
              source: sourceName,
              category: item.category || 'relevant',
              pubDate: item.date_published || '',
              region,
              industrial,
              feedName: item._source?.feedName || authorName || '',
              tags: item.tags || []
            };
          });

          // Apply timeframe filter
          const days = parseInt(timeframe, 10) || 1;
          const cutoff = new Date(Date.now() - days * 24 * 60 * 60 * 1000);
          const recent = articles.filter(a => {
            if (!a.pubDate) return true;
            return new Date(a.pubDate) >= cutoff;
          });

          setPreviewArticles(recent);
          setShowArticlePanel(true);
          setRemovedIds(new Set());
          setArticleFeedback({});
          setShowRejectMenu(null);
        } catch (e) {
          console.error('Error loading preview articles:', e);
          alert('Failed to load articles for preview.');
        } finally {
          setArticlePanelLoading(false);
        }
      }, [timeframe, detectRegion, isLikelyIndustrial]);

      // Apply filters and compute grouped/filtered articles
      const filteredGrouped = useMemo(() => {
        if (!previewArticles) return null;

        let filtered = previewArticles;

        // Region filter: only NJ, PA, FL
        if (filters.region) {
          filtered = filtered.filter(a => a.region === 'NJ' || a.region === 'PA' || a.region === 'FL' || a.region === null);
        }

        // Industrial filter
        if (filters.industrial) {
          filtered = filtered.filter(a => a.industrial);
        }

        // Dedup by normalized title
        if (filters.dedup) {
          const seen = new Set();
          filtered = filtered.filter(a => {
            const norm = normalizeForDedup(a.title);
            if (seen.has(norm)) return false;
            seen.add(norm);
            return true;
          });
        }

        // Group by category
        const groups = { relevant: [], transactions: [], availabilities: [], people: [] };
        for (const a of filtered) {
          const cat = groups[a.category] ? a.category : 'relevant';
          groups[cat].push(a);
        }

        return groups;
      }, [previewArticles, filters, normalizeForDedup]);

      // Count filtered-out articles
      const filterStats = useMemo(() => {
        if (!previewArticles || !filteredGrouped) return { total: 0, shown: 0, removed: 0 };
        const allFiltered = Object.values(filteredGrouped).flat();
        const shown = allFiltered.filter(a => !removedIds.has(a.id));
        return {
          total: previewArticles.length,
          shown: shown.length,
          filtered: previewArticles.length - allFiltered.length,
          removed: removedIds.size
        };
      }, [previewArticles, filteredGrouped, removedIds]);

      const handleRemoveArticle = useCallback((id) => {
        setRemovedIds(prev => new Set([...prev, id]));
      }, []);

      const handleRestoreArticle = useCallback((id) => {
        setRemovedIds(prev => {
          const next = new Set(prev);
          next.delete(id);
          return next;
        });
      }, []);

      // Phase 2: Feedback handlers
      const rejectionReasons = [
        { label: 'Not Relevant', value: 'not_relevant' },
        { label: 'Wrong Region', value: 'wrong_region' },
        { label: 'Duplicate', value: 'duplicate' },
        { label: 'Old News', value: 'old_news' },
        { label: 'Not CRE Related', value: 'not_cre' },
        { label: 'Bad Description', value: 'bad_description' },
        { label: 'Other', value: 'other' }
      ];

      const buildFeedbackEntry = useCallback((article, action, reason, section) => {
        const normTitle = (article.title || '').toLowerCase()
          .replace(/\s*[-\u2013\u2014|]\s*(costar|globest|msn|yahoo|bisnow|commercialsearch|rebusinessonline|connect cre|the business journals|commercial observer|supply chain dive|freightwaves|real estate nj|wsj|loopnet).*$/i, '')
          .replace(/^news\s*\|\s*/i, '')
          .replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();
        return {
          articleId: article.id,
          title: article.title,
          normalizedTitle: normTitle,
          action: action,
          reason: reason || null,
          section: section || article.category || 'relevant',
          source: article.source || '',
          date: new Date().toISOString().split('T')[0],
          user: WoodmontUtils.getUserId() || 'unknown'
        };
      }, []);

      const handleApproveArticle = useCallback((article, section) => {
        setArticleFeedback(prev => ({
          ...prev,
          [article.id]: { action: 'approved', reason: null }
        }));
        setShowRejectMenu(null);
        // Sync feedback to GitHub
        const entry = buildFeedbackEntry(article, 'approved', null, section);
        WoodmontUtils.syncFeedbackToGitHub(entry).then(result => {
          if (!result.ok) console.warn('Feedback sync failed:', result.reason);
        });
      }, [buildFeedbackEntry]);

      const handleRejectArticle = useCallback((article, reason, section) => {
        setArticleFeedback(prev => ({
          ...prev,
          [article.id]: { action: 'rejected', reason: reason }
        }));
        setShowRejectMenu(null);
        // Sync feedback to GitHub
        const entry = buildFeedbackEntry(article, 'rejected', reason, section);
        WoodmontUtils.syncFeedbackToGitHub(entry).then(result => {
          if (!result.ok) console.warn('Feedback sync failed:', result.reason);
        });
        // Also add to excluded-articles.json
        WoodmontUtils.syncExcludeToGitHub(article.id, article.url, article.title).then(result => {
          if (!result.ok && result.reason !== 'already_excluded') console.warn('Exclude sync failed:', result.reason);
        });
      }, [buildFeedbackEntry]);

      const downloadNewsletter = useCallback(async () => {
        if (!html) return;
        
        try {
          // Create a temporary container
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = html;
          tempDiv.style.width = '210mm'; // A4 width
          tempDiv.style.padding = '20mm';
          tempDiv.style.backgroundColor = '#ffffff';
          tempDiv.style.position = 'absolute';
          tempDiv.style.left = '-9999px';
          tempDiv.style.top = '0';
          document.body.appendChild(tempDiv);
          
          // Wait for images to load
          const images = tempDiv.getElementsByTagName('img');
          await Promise.all(Array.from(images).map(img => {
            if (img.complete) return Promise.resolve();
            return new Promise((resolve, reject) => {
              img.onload = resolve;
              img.onerror = resolve; // Continue even if image fails
              setTimeout(resolve, 3000); // Timeout after 3 seconds
            });
          }));
          
          // Generate canvas
          const canvas = await html2canvas(tempDiv, {
            scale: 2,
            useCORS: true,
            allowTaint: false,
            backgroundColor: '#ffffff',
            width: tempDiv.scrollWidth,
            height: tempDiv.scrollHeight,
            windowWidth: tempDiv.scrollWidth,
            windowHeight: tempDiv.scrollHeight
          });

          // Remove temporary container
          document.body.removeChild(tempDiv);
          
          // Create PDF
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: 'a4'
          });

          const imgData = canvas.toDataURL('image/png');
          const pdfWidth = pdf.internal.pageSize.getWidth();
          const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
          
          // Add image to PDF, handling multi-page if needed
          let heightLeft = pdfHeight;
          let position = 0;
          
          pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, pdfHeight);
          heightLeft -= pdf.internal.pageSize.getHeight();
          
          while (heightLeft >= 0) {
            position = heightLeft - pdfHeight;
            pdf.addPage();
            pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, pdfHeight);
            heightLeft -= pdf.internal.pageSize.getHeight();
          }
          
          // Save PDF
          const date = new Date().toISOString().split('T')[0];
          pdf.save(`industrial-newsletter-${date}.pdf`);
        } catch (error) {
          console.error('Error generating PDF:', error);
          alert('Error generating PDF. Please try again.');
        }

    const App = () => {

      const handleRemoveIgnoredTopic = useCallback((keyword) => {

      // Handle tracking/ignoring from URL parameters (for newsletter links)
      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);

        // Support both formats: ?track=keyword and ?action=track&keyword=value
        const action = urlParams.get('action');
        const keyword = urlParams.get('keyword');
        const trackKeyword = urlParams.get('track');
        const ignoreKeyword = urlParams.get('ignore');

        let actionTaken = false;

        const articleId = urlParams.get('articleId');
        const articleTitle = urlParams.get('title');

        // Handle ?action=track&keyword=value format
        if (action === 'track' && keyword) {
          handleTrackKeyword(decodeURIComponent(keyword));
          actionTaken = true;
          alert(`Added "${decodeURIComponent(keyword)}" to tracked sources!`);
        } else if (action === 'ignore' && articleId) {
          // Ignore specific article (from newsletter links)
          const decodedId = decodeURIComponent(articleId);
          const decodedTitle = articleTitle ? decodeURIComponent(articleTitle) : 'Unknown article';
          handleIgnoreArticle({ id: decodedId, link: decodedId, title: decodedTitle, source: '' }, 'Ignored from newsletter');
          actionTaken = true;
          alert(`Ignored "${decodedTitle}". It will be hidden from your feed.`);
        } else if (action === 'ignore' && keyword) {
          handleIgnoreKeyword(decodeURIComponent(keyword));
          actionTaken = true;
          alert(`Added "${decodeURIComponent(keyword)}" to ignored sources. These articles will be hidden.`);
        }
        // Handle legacy ?track=keyword format
        else if (trackKeyword) {
          handleTrackKeyword(decodeURIComponent(trackKeyword));
          actionTaken = true;
        }
        // Handle legacy ?ignore=keyword format
        else if (ignoreKeyword) {
          handleIgnoreKeyword(decodeURIComponent(ignoreKeyword));
          actionTaken = true;
        }

        // Clean the URL after processing
        if (actionTaken) {
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      }, [handleTrackKeyword, handleIgnoreKeyword, handleIgnoreArticle]);

      const fetchItems = useCallback(async (showLoading = true) => {
        if (showLoading) setLoading(true);
        try {
          // Use feed.json for static GitHub Pages, /api/articles for local server
          const url = IS_STATIC ? 'feed.json' : '/api/articles';
          const res = await fetch(url);
          if (!res.ok) {
            throw new Error(`Failed to fetch: ${res.status} ${res.statusText}`);
          }
          const data = await res.json();
          // Handle both JSON Feed format (items array) and API format
          const articles = IS_STATIC 
            ? (data.items || []).map(item => {
                // Handle author - can be object or string
                let authorName = '';
                if (item.author) {
                  authorName = typeof item.author === 'string' ? item.author : (item.author.name || '');
                }

                return {

                  description: item.content_text || item.content_html || item.description || '',

                };

            : (Array.isArray(data.items) ? data.items : []);
          // Merge raw picks into the articles list
          if (IS_STATIC) {
            try {
              const rawPicks = getRawPicks();
              const existingIds = new Set(articles.map(a => a.id));
              Object.entries(rawPicks).forEach(([id, p]) => {
                if (!existingIds.has(id)) {
                  articles.push({
                    id, title: p.t || 'Untitled', link: p.u || '#', source: p.s || 'Unknown',
                    pubDate: p.d || new Date().toISOString(), description: p.ex || '',

                    _fromRawPick: true
                  });

              });
            } catch (e) { console.warn('Could not merge raw picks:', e); }
          }
          // ---- Feed-level dedup (display only) ----------------------------
          // feed.json can carry the SAME deal from several outlets — e.g. the
          // Woodmont/Sagard Rahway redevelopment showed up 5× and the Sagard NJ
          // acquisition 2×. The send pipeline (email.ts) already collapses these
          // via developer signatures; mirror that here so the website feed shows
          // one card per story. Two passes:
          //   1) normalized title (strips " - Publisher"): catches exact cross-source dupes
          //   2) developer + location/action signature: catches same deal, different phrasing
          // Only articles that name a tracked developer are eligible for pass 2,
          // so ordinary articles are never over-collapsed.
          const DEV_ENTITIES = ['woodmont','sagard','prologis','bridge industrial','link logistics','rockefeller group','dermody','matrix development','crow holdings','butters'];
          const DEAL_CITIES = ['rahway','monmouth','edison','piscataway','carteret','newark','elizabeth','logan township','south florida','central new jersey','central nj','bethlehem','allentown','fort myers','miami','orlando','tampa','jacksonville'];
          const _normTitle = (t) => (t || '').toLowerCase()
            .replace(/\s+[-–—|]\s+[a-z0-9 .&'-]{1,50}$/i, '')
            .replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
          const _dealKeys = (a) => {
            const text = ((a.title || '') + ' ' + (a.description || a.content_text || a.summary || '')).toLowerCase();
            const devs = DEV_ENTITIES.filter(d => text.includes(d));
            if (!devs.length) return [];
            const devKey = devs.slice().sort().join('+');
            const keys = [];
            DEAL_CITIES.filter(c => text.includes(c)).forEach(c => keys.push(devKey + '@' + c));
            if (/acquir|acquisition/.test(text)) keys.push(devKey + '@acquire');
            return keys;
          };
          const _seenTitle = new Set();
          const _seenDeal = new Set();
          const dedupedArticles = articles.filter(a => {
            const tkey = _normTitle(a.title);
            const dkeys = _dealKeys(a);
            // A dropped article still contributes its signatures so the dedup is
            // transitive — e.g. the Rahway "break ground" story bridges the
            // location-less "Begins Redevelopment" headline to the "Q1 delivery"
            // one, collapsing all five variants to a single card.
            const isDup = (tkey && _seenTitle.has(tkey)) || dkeys.some(k => _seenDeal.has(k));
            if (tkey) _seenTitle.add(tkey);
            dkeys.forEach(k => _seenDeal.add(k));
            return !isDup;

        const availabilities = articles.filter(a => a.category === 'availabilities').sort(byDate).slice(0, 5);

        const buildDescGoth = (item) => {

      // Work theme newsletter builder - mirrors newsletter-work.ts buildWorkBriefing() exactly
    // =====================================================================
    // CAPITAL MARKETS PREVIEW (sandbox, 2026-09-18) — PREVIEW ONLY
    // =====================================================================
    // A separate client-side newsletter profile built on top of the articles
    // ALREADY loaded by this page. No network fetch, no feed.json or
