    </p>
  </div>
</body></html>`;
      };

      const generateNewsletter = useCallback(async () => {
        setLoading(true);
        try {
          if (IS_STATIC) {
            // Generate newsletter client-side using loaded articles
            const days = parseInt(newsletterTimeframe, 10);
            const cutoff = new Date(Date.now() - days * 24 * 60 * 60 * 1000);

            // Fetch server-synced excluded articles (in addition to localStorage)
            let serverExcludedIds = new Set();
            try {
              const exRes = await fetch('excluded-articles.json');
              if (exRes.ok) {
                const exData = await exRes.json();
                (exData.excludedIds || []).forEach(id => serverExcludedIds.add(id));
                (exData.excludedUrls || []).forEach(u => serverExcludedIds.add(u.toLowerCase()));
              }
            } catch (e) { console.warn('Could not load server excludes:', e); }

            const recentArticles = items.filter(item => {
              const articleId = item.id || item.link || item.title;
              const articleUrl = (item.link || item.url || '').toLowerCase();
              // Newsletter is a team product — only check team-level server excludes, not per-user ignores
              if (serverExcludedIds.has(articleId) || serverExcludedIds.has(articleUrl)) return false;
              // Capital Markets has its own as-of date and hour-based lookback.
              // Do not pre-trim that candidate pool with the general newsletter
              // timeframe or a 72h/7d Capital preview can silently behave like
              // the default 24h newsletter. cmBuildSections applies the chosen
              // Capital window after geography and classification are ready.
              if (newsletterTheme === 'capital-markets') return true;
              const pubDate = new Date(item.pubDate || item.fetchedAt || 0);
              return pubDate >= cutoff;
            });

            console.log(`[Newsletter] ${items.length} total items, ${recentArticles.length} after filter (${days}d cutoff: ${cutoff.toISOString()}, ${serverExcludedIds.size} server excludes)`);

            // Merge raw picks (from server preferences)
            try {
              const rawPicks = getRawPicks();
              const pickIds = new Set(recentArticles.map(a => a.id));
              Object.entries(rawPicks).forEach(([id, p]) => {
                if (!pickIds.has(id)) {
                  recentArticles.push({
                    id, title: p.t || 'Untitled', link: p.u || '#', source: p.s || 'Unknown',
                    pubDate: p.d || new Date().toISOString(), description: p.ex || '',
                    category: p.c === 'excluded' ? 'relevant' : (p.c || 'relevant'), _fromRawPick: true
                  });
                }
              });
            } catch (e) { console.warn('Could not load raw picks:', e); }

            // Fetch server-synced included articles (raw picks synced to GitHub)
            try {
              const incRes = await fetch('included-articles.json');
              if (incRes.ok) {
                const incData = await incRes.json();
                const existingIds = new Set(recentArticles.map(a => a.id));
                (incData.articles || []).forEach(a => {
                  if (a.id && !existingIds.has(a.id) && !serverExcludedIds.has(a.id)) {
                    recentArticles.push({
                      id: a.id, title: a.title || 'Untitled', link: a.url || '#',
                      source: a.source || 'Unknown', pubDate: a.date_published || new Date().toISOString(),
                      description: a.description || '', category: a.category || 'relevant',
                      _fromServerPick: true
                    });
                  }
                });
                console.log(`[Newsletter] Merged ${(incData.articles || []).length} server-synced picks, now ${recentArticles.length} articles`);
              }
            } catch (e) { console.warn('Could not load server includes:', e); }

            console.log(`[Newsletter] Final: ${recentArticles.length} articles for newsletter`, recentArticles.map(a => `[${a.category}] ${(a.title||'').substring(0,50)}`));

            // Use selected theme (work is default)
            // ONE shared eligibility + cleaning pass before theme dispatch, so
            // every theme receives identical articles. Timeframe filtering and
            // server exclusions already happened above; this does not re-filter
            // or re-order them.
            const prepared = prepareNewsletterArticles(recentArticles);
            console.log('[Newsletter] eligibility:', JSON.stringify(prepared.counts));
            const themeArticles = prepared.articles;
            let html;
            if (newsletterTheme === 'capital-markets') {
              // Sandbox profile. Uses only already-loaded articles; no external
              // news fetch, no feed/sent-state mutation, no email path.
              // LAZY: the public geography reference loads here - only when
              // Capital Markets Preview is actually generated - and only once.
              // It is a same-origin read of our own published JSON. If it fails,
              // every article resolves UNMAPPED, which is the safe outcome.
              await cmLoadGeography();
              html = buildCapitalMarketsNewsletterHTML(recentArticles, {
                asOfDate: cmAsOfDate || null,
                lookbackHours: parseInt(cmLookback, 10) || 24,
                watchlist: cmWatchlist,
              });
            } else if (newsletterTheme === 'work') {
              html = buildWorkNewsletterHTML(themeArticles, days);
            } else if (newsletterTheme === 'goth') {
              html = buildGothNewsletterHTML(themeArticles, days);
            } else {
              html = buildNewsletterHTML(themeArticles, days);
            }
            setNewsletterHTML(html);
            setNewsletterGenerated(true);
          } else {
            // For server-side, pass theme parameter
            const res = await fetch(`/api/newsletter?days=${newsletterTimeframe}&theme=${newsletterTheme}`);
            const data = await res.json();
            setNewsletterHTML(data.html || '');
            setNewsletterGenerated(true);
          }
        } catch (e) {
          console.error('Error generating newsletter:', e);
          setNewsletterHTML('<p>Error generating newsletter. Please try again.</p>');
        } finally {
          setLoading(false);
        }
      }, [newsletterTimeframe, newsletterTheme, items, cmAsOfDate, cmLookback, cmWatchlist]);

      const clearNewsletter = useCallback(() => {
        setNewsletterHTML('');
        setNewsletterGenerated(false);
      }, []);

      const addManualArticle = useCallback(async () => {
        if (!manualTitle.trim() || !manualUrl.trim()) {
          alert('Title and URL are required');
          return;
        }

        try {
          const response = await fetch((API_BASE || '') + '/api/manual', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + (localStorage.getItem('api_key') || '')
            },
            body: JSON.stringify({
              title: manualTitle,
              url: manualUrl,
              summary: manualSummary,
              category: manualCategory,
              source: manualSource || 'Manual Entry'
            })
          });

          if (response.ok) {
            alert('Article added successfully!');
            setManualTitle('');
            setManualUrl('');
            setManualSummary('');
            setManualCategory('relevant');
            setManualSource('');
            setShowManualForm(false);
            // Refresh articles
            fetchItems(true);
          } else {
            const error = await response.text();
            alert('Error adding article: ' + error);
          }
        } catch (error) {
          console.error('Error adding manual article:', error);
          alert('Error adding article. Please try again.');
        }
      }, [manualTitle, manualUrl, manualSummary, manualCategory, manualSource, fetchItems]);

      const sendNewsletterEmail = useCallback(async () => {
        if (!newsletterHTML) {
          alert('Generate newsletter first');
          return;
        }

        setEmailLoading(true);
        try {
          const response = await fetch((API_BASE || '') + '/api/send-newsletter', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              html: newsletterHTML,
              timeframe: newsletterTimeframe,
              recipients: newsletterRecipients.split(',').map(r => r.trim()).filter(r => r)
            })
          });

          if (response.ok) {
            const result = await response.json();
            const recipientCount = result.recipients || 1;
            alert(`Newsletter sent successfully to ${recipientCount} recipient${recipientCount > 1 ? 's' : ''}!`);
          } else {
            const error = await response.text();
            alert('Error sending newsletter: ' + error);
          }
        } catch (error) {
          console.error('Error sending newsletter:', error);
          alert('Error sending newsletter. Please try again.');
        } finally {
          setEmailLoading(false);
        }
      }, [newsletterHTML, newsletterTimeframe, newsletterRecipients]);

      const handleArticleClick = useCallback((article) => {
        setSelectedArticle(article);
        setShowArticlePreview(true);
      }, []);

      const closeArticlePreview = useCallback(() => {
        setSelectedArticle(null);
        setShowArticlePreview(false);
      }, []);

      const fetchFilteredArticles = useCallback(async () => {
        try {
          const res = await fetch((API_BASE || '') + '/api/articles');
          const data = await res.json();
          const allArticles = Array.isArray(data.items) ? data.items : [];
          const filtered = allArticles.filter(it => it.category === reviewCategory);
          setFilteredArticles(filtered);
        } catch (e) {
          console.error('Error fetching filtered articles:', e);
          setFilteredArticles([]);
        }
      }, [reviewCategory]);

      const approveArticle = useCallback(async (articleId, newCategory) => {
        try {
          const response = await fetch((API_BASE || '') + '/api/approve-article', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              articleId,
              newCategory
            })
          });

          if (response.ok) {
            alert('Article approved successfully!');
            fetchItems(true);
            fetchFilteredArticles();
          } else {
            const error = await response.text();
            alert('Error approving article: ' + error);
          }
        } catch (error) {
          console.error('Error approving article:', error);
          alert('Error approving article. Please try again.');
        }
      }, [fetchItems, fetchFilteredArticles]);

      const excludeArticle = useCallback(async (articleId) => {
        if (!confirm('Are you sure you want to exclude this article?')) return;
        
        try {
          const response = await fetch((API_BASE || '') + '/api/blacklist-article', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              articleId
            })
          });

          if (response.ok) {
            alert('Article excluded successfully!');
            fetchItems(true);
            fetchFilteredArticles();
          } else {
            const error = await response.text();
            alert('Error excluding article. Please try again.');
          }
        } catch (error) {
          console.error('Error excluding article:', error);
          alert('Error excluding article. Please try again.');
        }
      }, [fetchItems, fetchFilteredArticles]);

      const fetchFeedHealth = useCallback(async () => {
        setFeedHealthLoading(true);
        try {
          const res = await fetch(IS_STATIC ? 'feed-health.json' : '/api/feed-health');
          if (!res.ok) {
            throw new Error(`Failed to fetch feed health: ${res.status}`);
          }
          const data = await res.json();
          setFeedHealthReport(data);
          setShowFeedHealth(true);
        } catch (e) {
          console.error('Error fetching feed health:', e);
          alert('Feed health report not available. It will be generated on the next scheduled RSS update.');
        } finally {
          setFeedHealthLoading(false);
        }
      }, []);

      useEffect(() => {
        const init = async () => {
          // Load server preferences before fetching items (so rawPicks merge works)
          const userId = getUserId();
          if (userId) {
            await loadServerPreferences(userId);
            setTrackedTopics(getTrackedTopics());
            setIgnoredTopics(getIgnoredTopics());
            setIgnoredArticles(getIgnoredArticles());
          }
          fetchItems();
          fetchLastFetchInfo();
        };
        init();

        const interval = setInterval(() => {
          if (viewMode === "articles") {
            fetchItems(false);
          }
        }, 5 * 60 * 1000); // 5 minutes

        return () => clearInterval(interval);
      }, [fetchItems, fetchLastFetchInfo, viewMode]);

      const sources = useMemo(() => {
        const uniqueSources = new Set(items.map(item => item.source || item.publisher).filter(Boolean));
        return Array.from(uniqueSources).sort();
      }, [items]);

      const filtered = useMemo(() => {
        let list = [...items];
        
        // Filter out articles with "not relevant", "excluded", and "blacklisted" categories
        list = list.filter(it => it.category !== 'not relevant' && it.category !== 'excluded' && it.category !== 'blacklisted');
        
        if (timeframe) {
          const daysAgo = parseInt(timeframe, 10);
          const cutoffDate = new Date(Date.now() - daysAgo * 24 * 60 * 60 * 1000);
          list = list.filter(it => {
            const pubDate = new Date(it.pubDate || it.fetchedAt || 0);
            return pubDate >= cutoffDate;
          });
        }
        
        if (query) {
          const q = query.toLowerCase();
          list = list.filter(it =>
            (it.title && it.title.toLowerCase().includes(q)) ||
            (it.description && it.description.toLowerCase().includes(q))
          );
        }

        if (region) {
          list = list.filter(it => {
            const r = region.toLowerCase();
            return (it.title + " " + it.description).toLowerCase().includes(r);
          });
        }

        if (category) {
          list = list.filter(it => it.category === category);
        }

        if (source) {
          list = list.filter(it => (it.source || it.publisher) === source);
        }

        if (sort === "newest") {
          list.sort((a, b) => new Date(b.pubDate || b.fetchedAt || 0) - new Date(a.pubDate || a.fetchedAt || 0));
        } else {
          list.sort((a, b) => new Date(a.pubDate || a.fetchedAt || 0) - new Date(b.pubDate || b.fetchedAt || 0));
        }

        return list;
      }, [items, query, region, category, source, sort, timeframe]);

      return (
        <div className={`min-h-screen ${theme === 'dark' ? 'dark bg-slate-900' : 'bg-slate-50'}`}>
          <div className="container">
          <Header timeframe={timeframe} theme={theme} setTheme={setTheme} />
          <FiltersBar
            query={query} setQuery={setQuery}
            region={region} setRegion={setRegion}
            category={category} setCategory={setCategory}
            source={source} setSource={setSource}
            sort={sort} setSort={setSort}
            timeframe={timeframe} setTimeframe={setTimeframe}
            sources={sources}
            onRefresh={onRefresh}
            stats={{ filtered: filtered.length, total: items.length, updated: lastUpdated }}
            viewMode={viewMode}
            setViewMode={setViewMode}
              lastFetchInfo={lastFetchInfo}
              refreshLoading={refreshLoading}
          />
          {viewMode === "articles" ? (
              <>
                {/* Tracked & Ignored Topics Panel */}
                <div className="max-w-6xl mx-auto px-4 mb-4">
                  <TrackedTopicsPanel
                    trackedTopics={trackedTopics}
                    ignoredTopics={ignoredTopics}
                    ignoredArticles={ignoredArticles}
                    onRemoveTopic={handleRemoveTrackedTopic}
                    onAddTopic={handleTrackKeyword}
                    onRemoveIgnored={handleRemoveIgnoredTopic}
                    onRemoveIgnoredArticle={handleRemoveIgnoredArticle}
                    matchingCount={matchingArticlesCount}
                    onUserChange={handleUserChange}
                    currentUser={currentUser}
                  />
                </div>
                <ArticleGrid
                  items={filtered}
                  loading={loading || refreshLoading}
                  onArticleClick={handleArticleClick}
                  trackedTopics={trackedTopics}
                  ignoredTopics={ignoredTopics}
                  ignoredArticles={ignoredArticles}
                  onTrackKeyword={handleTrackKeyword}
                  onIgnoreArticle={handleIgnoreArticle}
                  onSendToRaw={handleSendToRaw}
                  onAddToNewsletter={handleAddToNewsletter}
                  onRemoveFromNewsletter={handleRemoveFromNewsletter}
                />
              </>
            ) : viewMode === "newsletter" ? (
            <NewsletterPreview
              html={newsletterHTML}
              loading={loading}
              timeframe={newsletterTimeframe}
              setTimeframe={setNewsletterTimeframe}
              theme={newsletterTheme}
              setTheme={setNewsletterTheme}
              darkMode={theme === 'dark'}
              onGenerate={generateNewsletter}
              onClear={clearNewsletter}
              generated={newsletterGenerated}
              newsletterRecipients={newsletterRecipients}
              setNewsletterRecipients={setNewsletterRecipients}
              onSendEmail={sendNewsletterEmail}
              emailLoading={emailLoading}
              feedHealthReport={feedHealthReport}
              showFeedHealth={showFeedHealth}
              setShowFeedHealth={setShowFeedHealth}
              onFetchFeedHealth={fetchFeedHealth}
              feedHealthLoading={feedHealthLoading}
              cmAsOfDate={cmAsOfDate}
              setCmAsOfDate={setCmAsOfDate}
              cmLookback={cmLookback}
              setCmLookback={setCmLookback}
              cmWatchlist={cmWatchlist}
              setCmWatchlist={setCmWatchlist}
              />
            ) : (
              <AdminPanel
                manualTitle={manualTitle}
                setManualTitle={setManualTitle}
                manualUrl={manualUrl}
                setManualUrl={setManualUrl}
                manualSummary={manualSummary}
                setManualSummary={setManualSummary}
                manualCategory={manualCategory}
                setManualCategory={setManualCategory}
                manualSource={manualSource}
                setManualSource={setManualSource}
                showManualForm={showManualForm}
                setShowManualForm={setShowManualForm}
                onAddManualArticle={addManualArticle}
                newsletterRecipients={newsletterRecipients}
                setNewsletterRecipients={setNewsletterRecipients}
                reviewMode={reviewMode}
                setReviewMode={setReviewMode}
                filteredArticles={filteredArticles}
                fetchFilteredArticles={fetchFilteredArticles}
                approveArticle={approveArticle}
                excludeArticle={excludeArticle}
                reviewCategory={reviewCategory}
                setReviewCategory={setReviewCategory}
              />
            )}

            {/* Article Preview Modal */}
            {showArticlePreview && (
              <ArticlePreview
                article={selectedArticle}
                onClose={closeArticlePreview}
                onExclude={excludeArticle}
              />
            )}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
