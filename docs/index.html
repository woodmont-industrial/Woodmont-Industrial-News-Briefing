<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Woodmont Industrial News Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/utils.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    const regions = ["All", "NJ", "PA", "FL"];
    const IS_STATIC = window.location.hostname !== 'localhost';
    const API_BASE = '';

    const Header = ({ timeframe, theme, setTheme }) => {
      const period = (() => {
        const days = parseInt(timeframe, 10);
        if (days === 1) return "Last 24 Hours";
        if (days === 2) return "Last 48 Hours";
        if (days === 3) return "Last 3 Days";
        if (days === 7) return "Last 7 Days";
        if (days === 14) return "Last 14 Days";
        if (days === 30) return "Last 30 Days";
        if (days === 90) return "Last 90 Days";
        if (days === 180) return "Last 6 Months";
        return "All Time";
      })();

      return (
        <header className="relative overflow-hidden">
          <div className={`absolute inset-0 bg-gradient-to-b ${theme === 'dark' ? 'from-[#02060d] via-[#061a33] to-[#0B223F]' : 'from-[#020814] via-[#07203c] to-[#0B223F]'}`}></div>
          <div className="relative px-6 py-10 text-center text-white">
            <div className="flex items-center justify-center gap-6">
              <div>
                <h1 className="text-4xl md:text-5xl font-bold mb-3 tracking-tight drop-shadow-lg">
                  🏢 Woodmont Industrial Partners
                </h1>
                <p className={`text-2xl md:text-3xl font-semibold mb-4 ${theme === 'dark' ? 'text-slate-300' : 'text-blue-100'}`}>
                  Daily Real Estate News Briefing
                </p>
                <div className="flex flex-wrap items-center justify-center gap-3 mt-4">
                  <span className="inline-flex items-center px-4 py-2 rounded-full bg-white/20 backdrop-blur-sm text-base font-medium">
                    📅 {period}
                  </span>
                  <span className="inline-flex items-center px-4 py-2 rounded-full bg-white/20 backdrop-blur-sm text-base font-medium">
                    📍 Focus Markets: <strong className="ml-1">NJ • PA • FL</strong>
                  </span>
                </div>
              </div>
              <button
                onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}
                className="p-3 rounded-xl bg-white/20 backdrop-blur-sm hover:bg-white/30 transition-all text-xl"
                title={`Switch to ${theme === 'light' ? 'dark' : 'light'} theme`}
              >
                {theme === 'light' ? '🌙' : '☀️'}
              </button>
            </div>
          </div>
        </header>
      );
    };

    const FiltersBar = ({ query, setQuery, region, setRegion, source, setSource, category, setCategory, sort, setSort, timeframe, setTimeframe, sources, onRefresh, stats, viewMode, setViewMode, lastFetchInfo, refreshLoading }) => (
      <>
        <div className="max-w-6xl mx-auto px-4 pb-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
          <div className="flex-1 flex gap-3 flex-wrap">
            <input
              className="w-full md:w-80 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-300 dark:focus:ring-blue-600 outline-none text-slate-900 dark:text-white placeholder-slate-500 dark:placeholder-slate-400"
              placeholder="Search title or summary"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
            />
            <select
              className="w-36 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-300 dark:focus:ring-blue-600 outline-none text-slate-900 dark:text-white"
              value={region}
              onChange={(e) => setRegion(e.target.value)}
            >
              {regions.map(r => <option key={r} value={r === "All" ? "" : r}>{r}</option>)}
            </select>
            <select
              className="w-52 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-300 dark:focus:ring-blue-600 outline-none text-slate-900 dark:text-white"
              value={category}
              onChange={(e) => setCategory(e.target.value)}
            >
              <option value="">Category: All</option>
              <option value="relevant">Relevant</option>
              <option value="transactions">Transactions</option>
              <option value="availabilities">Availabilities</option>
              <option value="people">People News</option>
            </select>
            <select
              className="w-44 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-300 dark:focus:ring-blue-600 outline-none text-slate-900 dark:text-white"
              value={source}
              onChange={(e) => setSource(e.target.value)}
            >
              <option value="">Source: All</option>
              {sources.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
            <select
              className="w-32 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-300 dark:focus:ring-blue-600 outline-none text-slate-900 dark:text-white"
              value={sort}
              onChange={(e) => setSort(e.target.value)}
            >
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
            </select>
            <select
              className="w-40 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-300 dark:focus:ring-blue-600 outline-none text-slate-900 dark:text-white"
              value={timeframe}
              onChange={(e) => setTimeframe(e.target.value)}
            >
              <option value="1">Last 24 hours</option>
              <option value="2">Last 48 hours</option>
              <option value="3">Last 3 days</option>
              <option value="7">Last 7 days</option>
              <option value="14">Last 14 days</option>
              <option value="30">Last 30 days</option>
              <option value="90">Last 90 days</option>
            </select>
          </div>
          <div className="flex gap-3 items-center">
            <div className="text-sm text-slate-600 dark:text-slate-400">
              {stats.filtered} of {stats.total} articles • Updated {stats.updated}
            </div>
              <div className="flex gap-2">
              <a
                  href="raw.html"
                  className="px-4 py-2 rounded-xl font-medium transition-all bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-orange-100 dark:hover:bg-orange-900 no-underline"
              >
                  📋 Raw
              </a>
              <button
                  onClick={() => setViewMode(viewMode === "articles" ? "newsletter" : "articles")}
                  className={`px-4 py-2 rounded-xl font-medium transition-all ${
                  viewMode === "articles"
                      ? "bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300"
                      : "bg-[#0B223F] text-white"
                }`}
              >
                  {viewMode === "articles" ? "📧 Newsletter" : "📰 Articles"}
              </button>
              {!IS_STATIC && (
              <button
                  onClick={() => setViewMode(viewMode === "admin" ? "articles" : "admin")}
                  className={`px-4 py-2 rounded-xl font-medium transition-all ${
                    viewMode === "admin"
                      ? "bg-purple-500 text-white"
                      : "bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300"
                  }`}
                >
                  ⚙️ Admin
              </button>
              )}
            </div>
            <button
              onClick={onRefresh}
              disabled={refreshLoading}
              className="px-4 py-2 bg-[#0B223F] text-white rounded-xl font-medium hover:bg-[#16406b] disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-2"
            >
              {refreshLoading ? (
                <>
                  <div className="animate-spin w-4 h-4 border-2 border-white border-t-transparent rounded-full"></div>
                  Refreshing...
                </>
              ) : (
                <>
                  🔄 Refresh
                </>
              )}
            </button>
          </div>
        </div>
        <div className="max-w-6xl mx-auto px-4 pb-4">
          {lastFetchInfo && (
            <div className="bg-slate-50 dark:bg-slate-800 rounded-lg p-3 text-sm border border-slate-200 dark:border-slate-700">
              <div className="flex items-center gap-4 flex-wrap">
                <div className="flex items-center gap-2">
                  <span className="text-slate-600 dark:text-slate-400">Last fetched:</span>
                  <span className="font-medium text-slate-900 dark:text-slate-100">
                    {lastFetchInfo.timestamp ? new Date(lastFetchInfo.timestamp).toLocaleString() : 'Never'}
                  </span>
                </div>
                <div className="flex items-center gap-3">
                  <span className="flex items-center gap-1">
                    <span className="w-2 h-2 bg-[#0B223F] rounded-full"></span>
                    <span className="text-blue-600 font-medium">{lastFetchInfo.totalFetched || lastFetchInfo.fetched || 0}</span>
                    <span className="text-slate-600 dark:text-slate-400">fetched</span>
                  </span>
                  <span className="flex items-center gap-1">
                    <span className="w-2 h-2 bg-[#0B223F] rounded-full"></span>
                    <span className="text-blue-600 font-medium">{lastFetchInfo.totalKept || lastFetchInfo.kept || 0}</span>
                    <span className="text-slate-600 dark:text-slate-400">kept</span>
                  </span>
                  <span className="flex items-center gap-1">
                    <span className="w-2 h-2 bg-purple-500 rounded-full"></span>
                    <span className="text-purple-600 font-medium">{lastFetchInfo.sourcesProcessed || lastFetchInfo.sources || 0}</span>
                    <span className="text-slate-600 dark:text-slate-400">sources</span>
                  </span>
                </div>
                {lastFetchInfo && (lastFetchInfo.lastArticle || lastFetchInfo.latestTitle) && (
                  <div className="flex items-center gap-2 ml-auto">
                    <span className="text-slate-600 dark:text-slate-400">Latest:</span>
                    <span className="font-medium text-slate-900 dark:text-slate-100 max-w-xs truncate" title={lastFetchInfo.lastArticle?.title || lastFetchInfo.latestTitle}>
                      {lastFetchInfo.lastArticle?.title || lastFetchInfo.latestTitle || 'N/A'}
                    </span>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      </>
    );

    // Placeholder images - from external utils.js
    const { getPlaceholderImage } = window.WoodmontUtils;

    const ArticleCard = ({ item, onClick, trackedMatches = [], onTrackKeyword, onIgnoreArticle, onSendToRaw, onAddToNewsletter, onRemoveFromNewsletter }) => {
      const category = item.category || 'relevant';
      const fallback = getPlaceholderImage(category, item.title);
      const [imgSrc, setImgSrc] = useState(item.image || fallback);
      const [imgError, setImgError] = useState(false);

      const published = item.pubDate ? new Date(item.pubDate) : null;
      const isValidDate = published && !isNaN(published.getTime());
      const isTracked = trackedMatches.length > 0;
      const suggestedKeywords = extractTrackableKeywords(item);

      // Quick track - uses first suggested keyword or source
      const quickTrack = () => {
        const keyword = suggestedKeywords[0] || item.source || item.title?.split(' ').slice(0, 2).join(' ');
        if (keyword) {
          onTrackKeyword && onTrackKeyword(keyword, item.title);
        }
      };

      // Quick ignore - ignores THIS SPECIFIC ARTICLE only with multiple choice
      const [showMoreMenu, setShowMoreMenu] = useState(false);
      const ignoreReasons = [
        { label: 'Not Relevant', value: 'not_relevant' },
        { label: 'Wrong Region', value: 'wrong_region' },
        { label: 'Duplicate', value: 'duplicate' },
        { label: 'Old News', value: 'old_news' },
        { label: 'Not CRE Related', value: 'not_cre' },
        { label: 'Other', value: 'other' }
      ];

      const handleIgnoreWithReason = (reason) => {
        setShowMoreMenu(false);
        onIgnoreArticle && onIgnoreArticle(item, reason);
      };

      // Category colors for branded overlay
      const categoryColors = {
        transactions: 'from-amber-600/80',
        availabilities: 'from-[#16406b]/80',
        people: 'from-purple-600/80',
        relevant: 'from-slate-700/80'
      };

      return (
        <article
          className={`card-anim bg-white dark:bg-slate-800 rounded-2xl overflow-hidden flex flex-col h-full focus-within:ring-2 focus-within:ring-blue-400 dark:focus-within:ring-blue-600 cursor-pointer ${isTracked ? 'tracked-highlight' : ''}`}
          onClick={(e) => {
            // Don't trigger onClick if clicking the track menu
            if (!e.target.closest('.track-menu-container')) {
              onClick && onClick(item);
            }
          }}
        >
          <div className="relative aspect-video bg-slate-200 dark:bg-slate-900 overflow-hidden">
            <img
              src={imgError ? fallback : (imgSrc || fallback)}
              alt={item.title || 'Article image'}
              className="img-anim w-full h-full object-cover"
              loading="lazy"
              onError={() => {
                setImgError(true);
                setImgSrc(fallback);
              }}
            />
            {/* Gradient overlay with category color */}
            <div className={`absolute inset-0 bg-gradient-to-t ${categoryColors[category] || categoryColors.relevant} via-transparent to-transparent pointer-events-none`}></div>
            <div className="absolute top-3 left-3 flex gap-2 flex-wrap">
              <span className="bg-white/90 dark:bg-slate-800/90 text-slate-900 dark:text-slate-100 text-xs font-semibold px-3 py-1.5 rounded-lg shadow-sm uppercase tracking-wide">
                {(() => {
                  // Prefer the resolved publisher; if that still has "Google News" prefix, strip it.
                  let src = item.source || item.publisher;
                  if (!src) src = (typeof getPublisherName === 'function') ? getPublisherName(item) : 'Source';
                  if (typeof src !== 'string') src = src.name || 'Source';
                  return src.replace(/^google\s+news\s+/i, '').trim() || 'Source';
                })()}
              </span>
              {/* Author chip suppressed when it duplicates the source or is a Google News feed name */}
              {item.author && (() => {
                const authorStr = typeof item.author === 'string' ? item.author : (item.author.name || '');
                if (!authorStr || /^google\s+news/i.test(authorStr)) return null;
                const srcStr = (item.source || item.publisher || '').toString();
                if (srcStr && authorStr.toLowerCase() === srcStr.toLowerCase()) return null;
                return (
                  <span className="bg-[#0B223F]/90 text-white text-xs font-medium px-3 py-1.5 rounded-lg shadow-sm">
                    By {authorStr}
                  </span>
                );
              })()}
            </div>
          </div>
          <div className="p-4 flex flex-col gap-3 flex-1">
            <div className="flex items-center gap-2 flex-wrap text-xs text-slate-600 dark:text-slate-400">
              {isValidDate && <span>{published.toLocaleDateString()}</span>}
              {item.category && (
                <span className={`px-2 py-1 rounded-full text-xs font-medium ${
                  item.category === 'transactions' ? 'bg-amber-100 dark:bg-amber-900/60 text-amber-800 dark:text-amber-300' :
                  item.category === 'availabilities' ? 'bg-blue-100 dark:bg-amber-900/60 text-blue-800 dark:text-amber-300' :
                  item.category === 'people' ? 'bg-purple-100 dark:bg-amber-900/60 text-purple-800 dark:text-amber-300' :
                  'bg-slate-100 dark:bg-amber-900/60 text-slate-800 dark:text-amber-300'
                }`}>
                  {item.category === 'transactions' ? 'Transactions' :
                   item.category === 'availabilities' ? 'Availabilities' :
                   item.category === 'people' ? 'People News' :
                   'Relevant'}
                </span>
              )}
              {/* Debug badges (?debug=1): predicted-publish reason + source tier + Woodmont LLM verdict */}
              {(() => {
                if (typeof window === 'undefined') return null;
                const isDebug = new URLSearchParams(window.location.search).get('debug') === '1';
                if (!isDebug) return null;
                const reason = item._predictedReason || item._classificationReason || '';
                const tier = item._tier || '';
                const willPublish = item._predictedPublish === true;
                const reasonColor = willPublish
                  ? 'bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-200'
                  : reason.startsWith('REJECT') || reason === 'EXCLUDED'
                    ? 'bg-red-100 text-red-800 dark:bg-red-900/60 dark:text-red-200'
                    : 'bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-200';
                // Woodmont LLM second-pass verdict
                const wmApprove = item._woodmontApprove;
                const wmReason = item._woodmontReason || '';
                const wmConf = item._woodmontConfidence;
                const wmClass = item._woodmontClassifier || '';
                const wmColor = wmApprove === true
                  ? 'bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-200'
                  : wmApprove === false
                    ? 'bg-red-100 text-red-800 dark:bg-red-900/60 dark:text-red-200'
                    : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400';
                return (
                  <>
                    {reason && (
                      <span className={`px-2 py-1 rounded-full text-xs font-medium ${reasonColor}`} title={`_predictedReason: ${reason}`}>
                        {reason}
                      </span>
                    )}
                    {tier && (
                      <span className="px-2 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300" title={`source tier ${tier}`}>
                        tier {tier}
                      </span>
                    )}
                    {wmApprove !== null && wmApprove !== undefined && (
                      <span
                        className={`px-2 py-1 rounded-full text-xs font-medium ${wmColor}`}
                        title={`Woodmont LLM (${wmClass || 'unknown'}, confidence ${wmConf ?? '?'}): ${wmReason}`}
                      >
                        {wmApprove ? 'LLM ✓' : 'LLM ✗'}{typeof wmConf === 'number' ? ` ${wmConf}` : ''}
                      </span>
                    )}
                  </>
                );
              })()}
            </div>
            <h3 className="text-lg font-semibold text-slate-900 dark:text-slate-100 leading-tight clamp-2">
              <a
                href={item.link}
                target="_blank"
                rel="noopener noreferrer"
                className="hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
              >
                {item.title}
              </a>
            </h3>
            {item.description && (
              <p className="text-sm text-slate-600 dark:text-slate-400 clamp-3 flex-1 leading-relaxed">
                {item.description}
              </p>
            )}
            <div className="mt-auto pt-3 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between">
              <a
                href={item.link}
                target="_blank"
                rel="noopener noreferrer"
                className="inline-flex items-center gap-2 text-sm font-semibold text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 transition-colors"
                onClick={(e) => e.stopPropagation()}
              >
                Read more →
              </a>

              {/* Action Buttons — +/- prominent, everything else under ⋯ */}
              <div className="track-menu-container relative flex items-center gap-1.5">
                {/* Add to Newsletter */}
                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    onAddToNewsletter && onAddToNewsletter(item);
                  }}
                  className="w-8 h-8 flex items-center justify-center rounded-lg text-lg leading-none font-bold text-white bg-gradient-to-b from-[#16406b] to-[#0B223F] border border-blue-900/50 shadow-sm hover:from-[#1e5a94] hover:to-[#16406b] hover:shadow-md active:scale-95 transition-all cursor-pointer"
                  title="Add this article to the next newsletter"
                >
                  +
                </button>

                {/* Remove from Newsletter */}
                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    onRemoveFromNewsletter && onRemoveFromNewsletter(item);
                  }}
                  className="w-8 h-8 flex items-center justify-center rounded-lg text-lg leading-none font-bold text-white bg-gradient-to-b from-rose-500 to-rose-700 border border-rose-800/50 shadow-sm hover:from-rose-400 hover:to-rose-600 hover:shadow-md active:scale-95 transition-all cursor-pointer"
                  title="Exclude this article from the newsletter"
                >
                  &minus;
                </button>

                {/* More menu: Track / Raw / Ignore */}
                <div className="relative">
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      e.preventDefault();
                      setShowMoreMenu(!showMoreMenu);
                    }}
                    className={`w-8 h-8 flex items-center justify-center rounded-lg text-lg leading-none font-bold shadow-sm active:scale-95 transition-all cursor-pointer border ${
                      isTracked
                        ? 'text-white bg-gradient-to-b from-[#16406b] to-[#0B223F] border-blue-900/50'
                        : 'text-slate-100 bg-gradient-to-b from-slate-600 to-slate-800 border-slate-900/50 hover:from-slate-500 hover:to-slate-700 hover:text-white hover:shadow-md'
                    }`}
                    title="More actions"
                  >
                    ⋯
                  </button>

                  {showMoreMenu && (
                    <div className="absolute right-0 bottom-full mb-2 w-52 bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-600 z-50 overflow-hidden">
                      <div className="py-1">
                        {/* Track */}
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            e.preventDefault();
                            if (!isTracked) quickTrack();
                            setShowMoreMenu(false);
                          }}
                          disabled={isTracked}
                          className={`w-full text-left px-4 py-2.5 text-sm font-medium transition-colors ${
                            isTracked
                              ? 'text-blue-600 dark:text-blue-400 cursor-default'
                              : 'text-slate-700 dark:text-slate-200 hover:bg-blue-50 dark:hover:bg-blue-900/30 hover:text-blue-700 dark:hover:text-blue-300'
                          }`}
                        >
                          {isTracked ? '★ Tracking topic' : '☆ Track this topic'}
                        </button>

                        {/* Send to Raw */}
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            e.preventDefault();
                            onSendToRaw && onSendToRaw(item);
                            setShowMoreMenu(false);
                          }}
                          className="w-full text-left px-4 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-amber-50 dark:hover:bg-amber-900/30 hover:text-amber-700 dark:hover:text-amber-400 transition-colors"
                        >
                          &rarr; Send to Raw picks
                        </button>

                        <div className="border-t border-slate-100 dark:border-slate-700 my-1"></div>

                        <div className="px-4 py-1.5 text-xs font-semibold uppercase tracking-wide text-slate-400 dark:text-slate-500">
                          Ignore &mdash; why?
                        </div>
                        {ignoreReasons.map((reason) => (
                          <button
                            key={reason.value}
                            onClick={(e) => {
                              e.stopPropagation();
                              e.preventDefault();
                              handleIgnoreWithReason(reason.label);
                            }}
                            className="w-full text-left px-4 py-2 text-sm text-slate-600 dark:text-slate-300 hover:bg-red-50 dark:hover:bg-red-900/30 hover:text-red-600 dark:hover:text-red-400 transition-colors"
                          >
                            {reason.label}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

              </div>
            </div>
          </div>
        </article>
      );
    };

                  {tokenWarning && (

                    </div>

                  <div className="bg-slate-50 dark:bg-slate-700/50 rounded-lg p-3 text-xs text-slate-500 dark:text-slate-400">
                    <p className="font-medium text-slate-600 dark:text-slate-300 mb-1">How it works:</p>
                    <p>When you click "Ignore" or make raw-feed picks, repo sync runs only if a token is connected in this tab. Reloading the page clears the token, and you must paste it again for that session.</p>
                  </div>
