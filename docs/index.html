              )}

              <p className="text-xs text-slate-400 mt-3">
                Preferences are stored {currentUser ? ('for ' + currentUser + ' on the server') : 'in your browser'}{ghToken ? ' and synced to GitHub' : ''}. Tracked articles are highlighted, ignored articles are hidden.
              </p>
            </div>
          )}
        </div>
      );
    };

    // ---- SHARED newsletter helpers (module scope) -------------------------
    // These were previously scoped INSIDE NewsletterPreview while the three
    // builders (buildNewsletterHTML / buildGothNewsletterHTML /
    // buildWorkNewsletterHTML) live inside App - so every builder threw
    // "ReferenceError: escapeHtml is not defined" the moment it ran. They are
    // pure functions with no component state, so module scope is their correct
    // home and both components now share ONE definition.

    // Publisher / journal name extraction. Mirrors src/shared/publisher-name.ts
    // so SPA labels match what the newsletter shows. Three strategies:
    //   1. Trailing-dash in title (Google News pattern: "...- WSVN")
    //   2. Domain map for direct sources (re-nj.com → "Real Estate NJ")
    //   3. Strip "Google News " prefix from feed names

    // HTML-escape helpers (mirror src/shared/html-escape.ts). Used by the
    // 3 newsletter preview builders below. Without these, an RSS title with an
    // injected script tag (angle-bracket-script ... angle-bracket-slash-script)
    // would render verbatim into the SPA preview DOM and execute. The SPA
    // is plain JS in a browser → XSS is real here (not just theoretical
    // like in the email path where clients sanitize).
    const HTML_ESCAPE_MAP = {
      '&': '&amp;', '<': '&lt;', '>': '&gt;',
      '"': '&quot;', "'": '&#39;', '`': '&#96;', '/': '&#47;'
    };
    const escapeHtml = (text) => {
      if (text === null || text === undefined) return '';
      return String(text).replace(/[&<>"'`\/]/g, ch => HTML_ESCAPE_MAP[ch] || ch);
    };
    const escapeAttr = escapeHtml;
    const safeUrl = (url) => {
      if (!url) return '#';
      const s = String(url).trim();
      if (!s) return '#';
      if (/^\s*(javascript|data|vbscript|file):/i.test(s)) return '#';
      try {
        const u = new URL(s);
        return (u.protocol === 'http:' || u.protocol === 'https:') ? s : '#';
      } catch { return '#'; }
    };

    // ---- Sentence segmentation (shared) -----------------------------------
    // The previous splitter was /[^.!?]+[.!?]+/g with a decimal-point guard. It
    // still broke on abbreviations: "Updated 6,500 sq. ft. industrial building
    // in Lodi trades for $1.2 million." truncated to "Updated 6,500 sq. ft."
    // Intl.Segmenter applies ICU sentence-break rules, which handle "sq. ft.",
    // "Inc.", "St." and decimals correctly. It is available in every current
    // browser; the fallback below covers older engines (Safari < 14.1).
    const SENTENCE_ABBREV = [
      'sq', 'ft', 'sq.ft', 'approx', 'est', 'no', 'vol', 'dept', 'div',
      'inc', 'llc', 'ltd', 'co', 'corp', 'lp', 'llp', 'plc',
      'st', 'ave', 'blvd', 'rd', 'dr', 'ln', 'ct', 'hwy', 'pkwy', 'ste', 'fl',
      'mr', 'mrs', 'ms', 'jr', 'sr', 'prof', 'gov', 'sen', 'rep',
      'jan', 'feb', 'mar', 'apr', 'jun', 'jul', 'aug', 'sep', 'sept', 'oct', 'nov', 'dec',
      'u.s', 'u.k', 'e.g', 'i.e', 'etc', 'vs', 'al',
    ];

    /**
     * Split text into sentences, keeping trailing punctuation and spacing.
     * Returns [] for empty input. Never splits inside a decimal number, a
     * percentage, or a known abbreviation.
     */
    const splitSentences = (text) => {
      const s = String(text == null ? '' : text);
      if (!s.trim()) return [];
      if (typeof Intl !== 'undefined' && typeof Intl.Segmenter === 'function') {
        try {
          const seg = new Intl.Segmenter('en', { granularity: 'sentence' });
          const out = [];
          for (const part of seg.segment(s)) if (part.segment) out.push(part.segment);
          if (out.length) return out;
        } catch (e) { /* fall through to the manual splitter */ }
      }
      // Fallback: mask the dots that must NOT end a sentence, split, unmask.
      const DOT = '\u0001';  // sentinel; never a raw control byte in source
      let masked = s.replace(/(\d)\.(\d)/g, '$1' + DOT + '$2');          // 1.2M, 23.5%
      for (const ab of SENTENCE_ABBREV) {
        const esc = ab.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        masked = masked.replace(new RegExp('(^|[\\s(])(' + esc + ')\\.', 'gi'),
                                (m, pre, word) => pre + word + DOT);
      }
      const parts = masked.match(/[^.!?]+[.!?]+[\s]*|[^.!?]+$/g) || [masked];
      return parts.map(p => p.split(DOT).join('.')).filter(p => p.trim());
    };

    /** First `n` sentences, joined, trimmed. Falls back to the raw text. */
    const firstSentences = (text, n) => {
      const parts = splitSentences(text);
      if (!parts.length) return String(text == null ? '' : text).trim();
      return parts.slice(0, n).join('').trim();
    };

    const PUBLISHER_DOMAIN_MAP = {
      're-nj.com': 'Real Estate NJ', 'roi-nj.com': 'ROI-NJ', 'njbiz.com': 'NJBIZ',
      'realestatenjmag.com': 'Real Estate NJ Magazine', 'njspotlightnews.org': 'NJ Spotlight News', 'nj.com': 'NJ.com',
      'lvb.com': 'Lehigh Valley Business', 'philly.com': 'Philly.com',
      'sun-sentinel.com': 'Sun Sentinel', 'miamiherald.com': 'Miami Herald',
      'tampabay.com': 'Tampa Bay Times', 'jacksonville.com': 'The Florida Times-Union',
      'globest.com': 'GlobeSt', 'bisnow.com': 'Bisnow', 'commercialobserver.com': 'Commercial Observer',
      'costar.com': 'CoStar', 'connectcre.com': 'Connect CRE', 'rebusinessonline.com': 'REBusiness Online',
      'commercialsearch.com': 'CommercialSearch', 'commercialcafe.com': 'CommercialCafe', 'credaily.com': 'CRE Daily',
      'cpexecutive.com': 'CPE', 'therealdeal.com': 'The Real Deal',
      'naiop.org': 'NAIOP', 'supplychaindive.com': 'Supply Chain Dive', 'supplychainbrain.com': 'SupplyChainBrain',
      'mhlnews.com': 'MHL News', 'areadevelopment.com': 'Area Development', 'bizjournals.com': 'The Business Journals',
      'prnewswire.com': 'PR Newswire', 'businesswire.com': 'BusinessWire',
      'wsj.com': 'WSJ', 'bloomberg.com': 'Bloomberg', 'reuters.com': 'Reuters', 'prologis.com': 'Prologis',
    };
    // Mirrors src/shared/publisher-name.ts getPublisherName (keep in sync).
    const looksLikeDomain = (s) => s.length <= 60 && !/\s/.test(s) && /^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9-]+)+$/i.test(s);
    const domainPublisher = (domain) => {
      const host = domain.toLowerCase().replace(/^www\./, '');
      if (host === 'news.google.com') return 'Google News';
      for (const d of Object.keys(PUBLISHER_DOMAIN_MAP)) { if (host === d || host.endsWith('.' + d)) return PUBLISHER_DOMAIN_MAP[d]; }
      return host;
    };
    // Canonical casing for a resolved name. The trailing-title path returns the
    // publisher exactly as the headline wrote it, so the same outlet could render
    // as both "GlobeSt" and "Globest" depending on the article. Fold any
    // case-insensitive match back onto the domain map's spelling so one publisher
    // always reads the same way everywhere.
    const PUBLISHER_CANONICAL = (() => {
      const m = new Map();
      for (const v of Object.values(PUBLISHER_DOMAIN_MAP)) m.set(v.toLowerCase(), v);
      return m;
    })();
    const canonicalPublisher = (name) => {
      const s = String(name || '').trim();
      return PUBLISHER_CANONICAL.get(s.toLowerCase()) || s;
    };

    // Trailing phrases that are ordinary headline tails, not mastheads. Guards
    // the lowercase path below so "... says report" never becomes a publisher.
    const NOT_A_PUBLISHER_TAIL = new Set(['report', 'reports', 'video', 'photos', 'opinion',
      'exclusive', 'analysis', 'update', 'updated', 'more', 'live', 'watch', 'podcast',
      'sources say', 'report says', 'sources', 'study', 'survey', 'op ed', 'explainer']);

    /** A short, masthead-shaped lowercase token such as "citybiz" or "patch".
     *  Deliberately narrow: 1-3 words, no sentence punctuation, not an ordinary
     *  headline tail. Only consulted for Google News items, where the
     *  "Title - publisher" separator is a reliable structural signal. */
    const plausibleLowercasePublisher = (s) => {
      const t = String(s || '').trim();
      if (t.length < 3 || t.length > 30) return false;
      if (NOT_A_PUBLISHER_TAIL.has(t.toLowerCase())) return false;
      if (/[.!?,;:]$/.test(t)) return false;
      const words = t.split(/\s+/);
      if (words.length > 3) return false;
      return /^[a-z0-9][a-z0-9&'’.-]*(?:\s+[a-z0-9&'’.-]+){0,2}$/.test(t);
    };

    const getPublisherName = (article) => {
      if (!article) return 'Source';
      const title = article.title || article.t || '';
      // Source label and URL are needed before the trailing-title check so the
      // lowercase path below can be restricted to Google News items.
      const sf = ((article._source && article._source.name) || (article._source && article._source.website) || article.source || article.s || '').toLowerCase();
      const url = (article.url || article.link || article.u || '').toLowerCase();
      const isAggregated = /^google news\b/i.test(sf) || /news\.google\.com/.test(url)
        || /google news/i.test((article._source && article._source.name) || article.source || '');
      const segs = title.split(/\s+[-–—|]\s+/);
      if (segs.length >= 2) {
        const last = segs[segs.length - 1].trim();
        if (/^[A-Z]/.test(last) && last.length >= 2 && last.length <= 60) return canonicalPublisher(last);
        // Domains keep using the domain resolver, before any lowercase guess.
        if (looksLikeDomain(last)) return domainPublisher(last);
        // Google News titles carry an explicit "Title - publisher" separator, so a
        // short lowercase tail there is a masthead ("citybiz"), not prose. Plain
        // publisher titles get no such treatment: a lowercase phrase ending an
        // ordinary headline must never be promoted to a publisher.
        if (isAggregated && plausibleLowercasePublisher(last)) return canonicalPublisher(last);
      }
      const hay = sf + ' ' + url;
      for (const d of Object.keys(PUBLISHER_DOMAIN_MAP)) { if (hay.includes(d)) return PUBLISHER_DOMAIN_MAP[d]; }
      // A feed LABEL is not a publisher. "Google News Manufacturing NJ/PA/FL"
      // was title-cased into "Manufacturing NJ/PA/FL" and shown as a masthead.
      // When the real publisher cannot be recovered from the trailing-title
      // pattern, the domain map or the URL, say "Google News" - an honest
      // aggregator name - rather than dressing up an internal label.
      if (/^google news\b/i.test(sf)) return 'Google News';
      if (sf === 'news.google.com' || /news\.google\.com/.test(url)) return 'Google News';
      const rawLabel = (article._source && article._source.name) || article.source || article.s || '';
      if (/google news/i.test(rawLabel)) return 'Google News';
      if (looksLikeDomain(rawLabel)) return domainPublisher(rawLabel);
      return canonicalPublisher(rawLabel) || 'Source';
    };

    // ---- Region resolution (shared, layered) -------------------------------
    // Priority:
    //   1. explicit region metadata already on the feed item
    //   2. explicit geography in title/description
    //   3. a weak feed/source hint, used ONLY to disambiguate
    //   4. otherwise null
    //
    // Rule that matters: an explicit NON-TARGET location in the text beats a
    // weak feed hint AND beats an in-target city mention, because the deal
    // location is what we cover. "Carteret-based supplier takes 126K SF in
    // California" is a California deal, not an NJ one, even though it arrived
    // on an NJ feed and names an NJ borough.
    //
    // Only 'NJ' | 'PA' | 'FL' are accepted as in-market. Everything else
    // resolves to 'NON_TARGET' (explicitly out of market) or null (unknown).
    // The NJ/PA/FL filter passes ONLY the three target values, so neither
    // NON_TARGET nor null leaks through — the fail-closed rule is unchanged.
    const REGION_TARGETS = ['NJ', 'PA', 'FL'];

    const US_STATE_NAMES = {
      alabama: 'AL', alaska: 'AK', arizona: 'AZ', arkansas: 'AR', california: 'CA',
      colorado: 'CO', connecticut: 'CT', delaware: 'DE', florida: 'FL', georgia: 'GA',
      hawaii: 'HI', idaho: 'ID', illinois: 'IL', indiana: 'IN', iowa: 'IA',
      kansas: 'KS', kentucky: 'KY', louisiana: 'LA', maine: 'ME', maryland: 'MD',
      massachusetts: 'MA', michigan: 'MI', minnesota: 'MN', mississippi: 'MS',
      missouri: 'MO', montana: 'MT', nebraska: 'NE', nevada: 'NV',
      'new hampshire': 'NH', 'new jersey': 'NJ', 'new mexico': 'NM', 'new york': 'NY',
      'north carolina': 'NC', 'north dakota': 'ND', ohio: 'OH', oklahoma: 'OK',
      oregon: 'OR', pennsylvania: 'PA', 'rhode island': 'RI', 'south carolina': 'SC',
      'south dakota': 'SD', tennessee: 'TN', texas: 'TX', utah: 'UT', vermont: 'VT',
      virginia: 'VA', washington: 'WA', 'west virginia': 'WV', wisconsin: 'WI',
      wyoming: 'WY',
    };

    // Municipalities that identify a state on their own. Deliberately limited to
    // names that are unambiguous in practice; anything genuinely shared between
    // states goes in REGION_AMBIGUOUS_CITIES instead.
    const REGION_CITIES = {
      NJ: ['newark', 'jersey city', 'elizabeth', 'edison', 'carteret', 'piscataway',
        'secaucus', 'perth amboy', 'bayonne', 'linden', 'kearny', 'teterboro',
        'moonachie', 'carlstadt', 'ridgefield park', 'north bergen', 'woodbridge',
        'south brunswick', 'north brunswick', 'cranbury', 'monroe township',
        'robbinsville', 'mount olive', 'mahwah', 'totowa', 'wayne', 'paterson',
        'passaic', 'hoboken', 'bridgewater', 'branchburg', 'somerset', 'raritan',
        'bound brook', 'burlington township', 'florence township', 'pennsauken',
        'cherry hill', 'vineland', 'millville', 'swedesboro', 'logan township',
        'west deptford', 'mount laurel', 'moorestown', 'gloucester township',
        'meadowlands', 'exit 8a', 'port newark', 'elizabethport'],
      PA: ['allentown', 'bethlehem', 'easton', 'reading', 'lehigh valley',
        'bristol township', 'breinigsville', 'fogelsville', 'macungie',
        'hazleton', 'wilkes-barre', 'scranton', 'pittston', 'jenkins township',
        'york', 'carlisle', 'mechanicsburg', 'harrisburg', 'middletown',
        'chambersburg', 'lancaster', 'ephrata', 'denver borough', 'exton',
        'king of prussia', 'bensalem', 'falls township', 'upper macungie'],
      FL: ['miami', 'miami-dade', 'miami dade', 'medley', 'doral', 'hialeah',
        'opa-locka', 'opa locka', 'miami gardens', 'miami lakes', 'sweetwater',
        'fort lauderdale', 'pompano beach', 'deerfield beach', 'davie',
        'sunrise', 'miramar', 'pembroke pines', 'coral springs', 'plantation',
        'west palm beach', 'palm beach', 'riviera beach', 'boca raton',
        'delray beach', 'jupiter', 'boynton beach', 'homestead', 'hialeah gardens',
        'tampa', 'orlando', 'jacksonville', 'lakeland', 'ocala', 'naples',
        'fort myers', 'sarasota', 'st. petersburg', 'saint petersburg'],
    };

    // Well-known out-of-market municipalities. Used so an article that names a
    // non-target CITY but no state ("Milpitas Industrial Portfolio") still
    // resolves as explicitly out of market rather than as unknown.
    const REGION_NON_TARGET_CITIES = [
      'milpitas', 'fremont ca', 'san jose', 'san francisco', 'oakland', 'hayward',
      'tracy', 'stockton', 'fontana', 'ontario ca', 'riverside', 'moreno valley',
      'rancho cucamonga', 'inland empire', 'los angeles', 'long beach', 'vernon ca',
      'commerce ca', 'san diego', 'sacramento', 'las vegas', 'reno', 'phoenix',
      'tucson', 'goodyear', 'tolleson', 'dallas', 'fort worth', 'houston',
      'san antonio', 'austin', 'el paso', 'laredo', 'atlanta', 'savannah',
      'charlotte', 'greensboro', 'raleigh', 'nashville', 'memphis', 'louisville',
      'lexington ky', 'cincinnati', 'columbus oh', 'cleveland', 'toledo',
      'indianapolis', 'chicago', 'joliet', 'elwood', 'milwaukee', 'minneapolis',
      'kansas city', 'st. louis', 'saint louis', 'denver', 'salt lake city',
      'seattle', 'tacoma', 'portland or', 'boise', 'baltimore', 'sparrows point',
      'richmond va', 'norfolk', 'boston', 'worcester', 'hartford', 'providence',
      // NY metro. These sit next door to the NJ market and arrive on NJ feeds,
      // so without them an RE-NJ feed hint mislabels a Staten Island or Brooklyn
      // deal as New Jersey.
      'staten island', 'brooklyn', 'queens', 'bronx', 'manhattan', 'long island city',
      'long island', 'yonkers', 'new rochelle', 'mount vernon', 'westchester',
      'hempstead', 'melville', 'ronkonkoma', 'islandia', 'bay shore', 'nassau county',
      'suffolk county', 'rockland county', 'orangeburg ny', 'nanuet',
      // DE / MD corridor that also shows up on NJ and PA feeds.
      'wilmington de', 'new castle de', 'newark de', 'elkton md', 'perryville md',
    ];

    // Names that exist in more than one state (Lodi NJ / Lodi CA / Lodi OH).
    // These never resolve on their own — they need a state in the text or a
    // single-state feed hint.
    // Counties, corridors and sub-regions ported from the legacy detectRegion so
    // nothing is lost when that permissive fallback is removed. ONLY names that
    // are effectively unique to one of the three states are listed: Montgomery,
    // Chester, Delaware, Middlesex, Essex, Union, Warren, Somerset, Mercer and
    // Cumberland counties all exist in several states, so they are deliberately
    // omitted rather than guessed at.
    const REGION_AREAS = {
      NJ: ['bergen county', 'hudson county', 'passaic county', 'monmouth county',
        'ocean county', 'burlington county', 'cape may county', 'atlantic county',
        'hunterdon county', 'new jersey turnpike', 'nj turnpike', 'north jersey',
        'south jersey', 'central jersey', 'newark bay', 'raritan valley',
        'route 1 corridor', 'exit 8a', 'exit 12', 'i-95 corridor nj'],
      PA: ['philadelphia', 'bucks county', 'lehigh county', 'northampton county',
        'berks county', 'dauphin county', 'lackawanna county', 'luzerne county',
        'schuylkill county', 'lancaster county', 'pa turnpike',
        'pennsylvania turnpike', 'i-78 corridor', 'greater philadelphia'],
      FL: ['miami-dade county', 'miami dade county', 'broward county', 'broward',
        'palm beach county', 'duval county', 'pinellas county', 'collier county',
        'sarasota county', 'manatee county', 'brevard county', 'seminole county',
        'south florida', 'central florida', 'north florida', 'i-4 corridor',
        'pompano', 'treasure coast', 'space coast'],
    };

    const REGION_AMBIGUOUS_CITIES = new Set(['lodi', 'franklin', 'salem', 'springfield',
      'clinton', 'washington', 'madison', 'jackson', 'newton', 'milford', 'oxford',
      'georgetown', 'fairfield', 'greenwich', 'hamilton', 'union', 'orange',
      'columbia', 'aurora', 'dover', 'middletown', 'bristol', 'lancaster', 'york',
      'reading', 'denver', 'manchester', 'plymouth', 'chester', 'auburn']);

    const regionPad = (text) => ' ' + String(text || '').toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
    const regionHas = (padded, phrase) =>
      padded.includes(' ' + phrase.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim() + ' ');

    /** Normalize any pre-existing region value to NJ/PA/FL, or null. */
    const normalizeRegionValue = (v) => {
      if (!v) return null;
      const s = String(v).trim().toUpperCase();
      if (REGION_TARGETS.includes(s)) return s;
      const byName = US_STATE_NAMES[String(v).trim().toLowerCase()];
      if (byName && REGION_TARGETS.includes(byName)) return byName;
      if (byName) return 'NON_TARGET';
      return null;
    };

    /** A feed/source label naming exactly ONE target state is a weak hint. */
    const regionFeedHint = (item) => {
      const label = [
        item && item.feedName,
        item && item._source && item._source.feedName,
        item && item.author && (typeof item.author === 'string' ? item.author : item.author.name),
        item && item.source,
      ].filter(Boolean).join(' ');
      if (!label) return null;
      const up = label.toUpperCase();
      const found = REGION_TARGETS.filter(st =>
        new RegExp('(^|[^A-Z])' + st + '([^A-Z]|$)').test(up));
      // "NJ/PA/FL" names three states and tells us nothing.
      return found.length === 1 ? found[0] : null;
    };

    // ---- Relation-aware geography -----------------------------------------
    // A place name in the text can play two very different roles:
    //   deal location  - "industrial portfolio in Miami-Dade County"
    //   party origin   - "the Boston-based private equity firm announced"
    // Treating every mention alike made a Miami-Dade acquisition resolve as
    // NON_TARGET because Boston appeared in the same sentence. Origin/HQ
    // mentions are therefore masked out before any geography is read, and a
    // location tied to the property or the transaction verb wins outright.

    // "Boston-based", "New Jersey-based", "based in X", "headquartered in X".
    const REGION_ORIGIN_RX = [
      /\b([A-Za-z.'’]+(?:[\s-][A-Za-z.'’]+){0,2})[-\s]based\b/gi,
      /\b(?:based|headquartered)\s+in\s+([A-Za-z.'’]+(?:[\s,]+[A-Za-z.'’]+){0,2})/gi,
    ];

    /** Blank out origin/HQ place names so they cannot decide the region. */
    const regionMaskOrigins = (text) => {
      let out = String(text || '');
      for (const rx of REGION_ORIGIN_RX) {
        out = out.replace(rx, (m, place) => m.replace(place, ' '.repeat(place.length)));
      }
      return out;
    };

    const REGION_PROPERTY_NOUN =
      'propert(?:y|ies)|portfolio|warehouse|facilit(?:y|ies)|building|site|park|campus' +
      '|cent(?:er|re)|plant|asset|space|industrial|logistics|distribution|flex|land';
    const REGION_DEAL_VERB =
      'leas\\w+|takes?|took|buys?|bought|acquir\\w+|sells?|sold|purchas\\w+|refinanc\\w+' +
      '|develop\\w+|opens?|delivers?|breaks? ground on|trades?|signs?|renews?|expands?';
    // A proper-noun run, optionally comma-joined, e.g. "Miami-Dade County",
    // "Edison, NJ", "Dallas, Texas".
    const REGION_PLACE = '([A-Z][A-Za-z.\'’-]*(?:[\\s,]+[A-Z][A-Za-z.\'’-]*){0,3})';

    const REGION_DEAL_RX = [
      // "portfolio in Miami-Dade County", "warehouse at 100 Main St, Edison, NJ"
      new RegExp('(?:' + REGION_PROPERTY_NOUN + ')\\s+(?:in|at)\\s+' + REGION_PLACE, 'gi'),
      // "acquires warehouse in Edison, NJ", "takes 126K SF in California"
      new RegExp('(?:' + REGION_DEAL_VERB + ')[^.!?]{0,70}?\\s+(?:in|at)\\s+' + REGION_PLACE, 'gi'),
      // "located in X"
      new RegExp('located\\s+in\\s+' + REGION_PLACE, 'gi'),
      // "Miami warehouse", "Allentown industrial park" - place used adjectivally
      new RegExp(REGION_PLACE + '\\s+(?:' + REGION_PROPERTY_NOUN + ')', 'g'),
      // "Edison, NJ 08817" - explicit city/state or address
      /([A-Z][A-Za-z.'’-]*(?:\s+[A-Z][A-Za-z.'’-]*){0,2},\s*[A-Z]{2})\b/g,
    ];

    /** Geography of one short fragment: NJ | PA | FL | NON_TARGET | null. */
    const regionGeoOf = (fragment) => {
      const s = String(fragment || '');
      const padded = regionPad(s);
      for (const m of s.matchAll(/,\s*([A-Z]{2})\b/g)) {
        const ab = m[1];
        if (REGION_TARGETS.includes(ab)) return ab;
        if (Object.values(US_STATE_NAMES).includes(ab)) return 'NON_TARGET';
      }
      for (const [name, abbr] of Object.entries(US_STATE_NAMES)) {
        if (regionHas(padded, name)) return REGION_TARGETS.includes(abbr) ? abbr : 'NON_TARGET';
      }
      for (const c of REGION_NON_TARGET_CITIES) if (regionHas(padded, c)) return 'NON_TARGET';
      for (const st of REGION_TARGETS) {
        for (const a of REGION_AREAS[st]) if (regionHas(padded, a)) return st;
      }
      const hits = new Set();
      for (const st of REGION_TARGETS) {
        for (const c of REGION_CITIES[st]) {
          if (!regionHas(padded, c) || REGION_AMBIGUOUS_CITIES.has(c)) continue;
          hits.add(st);
        }
      }
      return hits.size === 1 ? [...hits][0] : null;
    };

    /** The location tied to the property or the transaction, if any. */
    const regionDealLocation = (maskedText) => {
      for (const rx of REGION_DEAL_RX) {
        rx.lastIndex = 0;
        for (const m of String(maskedText || '').matchAll(rx)) {
          const geo = regionGeoOf(m[1]);
          if (geo) return geo;
        }
      }
      return null;
    };

    /** Every explicit geography in the text, with no relation implied. */
    const regionScan = (text) => {
      const padded = regionPad(text);
      const targets = new Set();
      let nonTarget = false, ambiguous = false;
      for (const [name, abbr] of Object.entries(US_STATE_NAMES)) {
        if (!regionHas(padded, name)) continue;
        if (REGION_TARGETS.includes(abbr)) targets.add(abbr); else nonTarget = true;
      }
      for (const m of String(text || '').matchAll(/,\s*([A-Z]{2})\b/g)) {
        const ab = m[1];
        if (REGION_TARGETS.includes(ab)) targets.add(ab);
        else if (Object.values(US_STATE_NAMES).includes(ab)) nonTarget = true;
      }
      for (const c of REGION_NON_TARGET_CITIES) if (regionHas(padded, c)) nonTarget = true;
      for (const st of REGION_TARGETS) {
        for (const a of REGION_AREAS[st]) if (regionHas(padded, a)) targets.add(st);
      }
      for (const st of REGION_TARGETS) {
        for (const c of REGION_CITIES[st]) {
          if (!regionHas(padded, c)) continue;
          if (REGION_AMBIGUOUS_CITIES.has(c)) { ambiguous = true; continue; }
          targets.add(st);
        }
      }
      return { targets, nonTarget, ambiguous };
    };

    /**
     * Resolve an article's region.
     * Returns 'NJ' | 'PA' | 'FL' | 'NON_TARGET' | null.
     *
     * Order:
     *   0. mask origin/HQ mentions ("Boston-based") - never decisive
     *   1. a STRONG deal-location relation (property/verb/address) wins
     *   2. otherwise unrelated explicit geography; target AND non-target both
     *      present with no relation -> null, because guessing either way is
     *      wrong half the time
     *   3. item metadata
     *   4. weak single-state feed hint
     *   5. null
     *
     * Metadata sits below the text so it can inform but never mask an
     * explicitly out-of-market deal.
     */
    const resolveRegion = (item, textOverride) => {
      const text = textOverride !== undefined && textOverride !== null
        ? textOverride
        : [item && item.title, item && item.description,
           item && item.content_text, item && item.summary].filter(Boolean).join(' ');

      // 0 + 1. relation-aware pass over text with origins masked out
      const masked = regionMaskOrigins(text);
      const dealGeo = regionDealLocation(masked);
      if (dealGeo) return dealGeo;

      // 2. no relation identified - fall back to unrelated mentions
      const scan = regionScan(masked);
      if (scan.nonTarget && scan.targets.size) return null;  // conflicting, unrelated
      if (scan.nonTarget) return 'NON_TARGET';
      if (scan.targets.size === 1) return [...scan.targets][0];
      if (scan.targets.size > 1) return null;

      // 3. item metadata, reached only when the text settled nothing
      const metaRaw = item && (item.region ||
        (Array.isArray(item.regions) ? item.regions[0] : item.regions) ||
        item.marketRegion || item.market_region);
      const meta = normalizeRegionValue(metaRaw);
      if (meta) return meta;

      // 4. weak feed/source hint, only when it names exactly one target state
      const hint = regionFeedHint(item);
      if (hint) return hint;

      return null;
    };

    // ---- Shared newsletter preparation (all three themes) ------------------
    // Every theme must receive the SAME eligible, cleaned articles. Previously
    // generateNewsletter handed recentArticles straight to each builder, so the
    // themes could and did disagree on eligibility, publisher and description.

    /**
     * Display-only publisher cleanup for a description.
     * Feed descriptions often end with the source appended as bare words:
     *   "Galvanize Acquires 302K SF Milpitas Industrial Portfolio Bisnow"
     * Strip that trailing token ONLY when it matches the resolved publisher, so
     * ordinary words that merely resemble a source are left alone. Never
     * mutates item.description / item.title / canonical feed data - the caller
     * uses the returned string for presentation only.
     */
    const cleanTrailingPublisher = (text, publisher) => {
      let out = String(text == null ? '' : text).trim();
      if (!publisher) return out;
      const variants = new Set();
      const add = (v) => { const s = String(v || '').trim(); if (s) variants.add(s); };
      add(publisher);
      add(publisher.replace(/\s+/g, ''));              // "Real Estate NJ" -> "RealEstateNJ"
      add(publisher.replace(/[^A-Za-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim());
      // Strip repeatedly: "... Portfolio Bisnow - Bisnow" happens.
      for (let pass = 0; pass < 3; pass++) {
        let changed = false;
        for (const v of variants) {
          // optional separator, the publisher, optional trailing punctuation
          const rx = new RegExp('[\\s\\-\\u2013\\u2014|:,]*' +
            v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[\\s.\\-\\u2013\\u2014|]*$', 'i');
          const next = out.replace(rx, '').trim();
          if (next !== out && next.length) { out = next; changed = true; }
        }
        if (!changed) break;
      }
      return out;
    };

    // Categories that describe a specific local property or deal. These must
    // carry target geography. National market intelligence does NOT live here:
    // 'relevant' is deliberately allowed to run without a region, because the
    // corpus intentionally carries national macro ("Data center construction
    // hits record", "CalSTRS adds $5B in CRE commitments"). Those stories are
    // governed by category and by the explicit out-of-market test below, not by
    // requiring an NJ/PA/FL region they will never have.
    const NEWSLETTER_LOCAL_CATEGORIES = new Set(['transactions', 'availabilities']);
    const NEWSLETTER_TARGETS = ['NJ', 'PA', 'FL'];

    /** True when the text explicitly names out-of-market geography, ignoring
     *  party-origin mentions ("Boston-based") which are never decisive. */
    // NOTE: a mentionsNonTargetGeography() helper lived here and vetoed any
    // article whose text named an out-of-market place. It dropped legitimate
    // in-market stories on the buyer's home city ("Central Florida ... to Denver
    // firm") and on adjacent geography ("Port of New York, New Jersey").
    // resolveRegion already resolves location ROLE; do not re-add a blanket scan.

    /**
     * The single eligibility + cleaning pass every theme shares.
     * Returns { articles, dropped, counts }. Input order is preserved.
     *
     * Deliberately NOT done here: timeframe filtering and server exclusions,
     * which already happened upstream in generateNewsletter - this function
     * receives the post-timeframe, post-exclusion list and must not re-filter
     * or re-order it.
     */
    const prepareNewsletterArticles = (articles) => {
      const kept = [], dropped = [];
      const counts = { input: 0, kept: 0, excludedCategory: 0, outOfMarket: 0, localWithoutGeography: 0 };
      for (const a of articles || []) {
        counts.input++;
        const cat = (a && a.category) || 'relevant';
        if (cat === 'exclude') {
          counts.excludedCategory++; dropped.push({ article: a, reason: 'EXCLUDED_CATEGORY' }); continue;
        }
        const text = [a && a.title, a && a.description, a && a.content_text, a && a.summary]
          .filter(Boolean).join(' ');
        const region = resolveRegion(a, text);

        // resolveRegion is authoritative here too. It already did relation-aware
        // classification: it knows "Denver firm" is the buyer and "Central
        // Florida" is the property, and that "Port of New York, New Jersey" is
        // an NJ story. Re-scanning the whole text for any non-target place after
        // that would throw away exactly what the relation analysis established.
        if (region === 'NON_TARGET') {
          counts.outOfMarket++; dropped.push({ article: a, reason: 'OUT_OF_MARKET', region }); continue;
        }

        // A local property/deal story must be in a target market.
        if (NEWSLETTER_LOCAL_CATEGORIES.has(cat) && !NEWSLETTER_TARGETS.includes(region)) {
          counts.localWithoutGeography++;
          dropped.push({ article: a, reason: 'LOCAL_DEAL_WITHOUT_TARGET_GEOGRAPHY', region });
          continue;
        }

        const publisher = getPublisherName(a) || 'Google News';
        const rawDesc = (a.description || a.content_text || a.summary || '').trim();
        counts.kept++;
        kept.push(Object.assign({}, a, {
          _region: region,
          _publisher: publisher,
          _cleanDescription: cleanTrailingPublisher(rawDesc, publisher),
        }));
      }
      return { articles: kept, dropped, counts };
    };

    const NewsletterPreview = ({ html, loading, timeframe, setTimeframe, theme, setTheme, darkMode, onGenerate, onClear, generated, newsletterRecipients, setNewsletterRecipients, onSendEmail, emailLoading, feedHealthReport, showFeedHealth, setShowFeedHealth, onFetchFeedHealth, feedHealthLoading, cmAsOfDate, setCmAsOfDate, cmLookback, setCmLookback, cmWatchlist, setCmWatchlist }) => {
      // Item 7: bring the Feed Health panel into view once it has rendered.
      // Opening it previously mounted the panel below the fold, so it looked
      // like nothing happened. Scroll only - feed-health generation untouched.
      const feedHealthRef = useRef(null);
      useEffect(() => {
        if (!showFeedHealth || !feedHealthReport) return;
        // rAF so the scroll runs AFTER the panel has actually been painted.
        const id = requestAnimationFrame(() => {
          const el = feedHealthRef.current;
          if (el && typeof el.scrollIntoView === "function") {
            el.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        });
        return () => cancelAnimationFrame(id);
      }, [showFeedHealth, feedHealthReport]);

      const [showTemplate, setShowTemplate] = useState(false);
      const [sendingEmail, setSendingEmail] = useState(false);

      // Article Preview Panel state (Phase 1)
      const [previewArticles, setPreviewArticles] = useState(null);
      const [removedIds, setRemovedIds] = useState(new Set());
      const [filters, setFilters] = useState({ region: true, industrial: true, dedup: true });
      const [showArticlePanel, setShowArticlePanel] = useState(false);
      const [articlePanelLoading, setArticlePanelLoading] = useState(false);

      // Feedback state (Phase 2)
      const [articleFeedback, setArticleFeedback] = useState({}); // {articleId: {action: 'approved'|'rejected', reason: null|string}}
      const [showRejectMenu, setShowRejectMenu] = useState(null); // articleId of currently shown reject menu


      // NOTE: the legacy detectRegion lived here. It matched a bare state or city
      // name anywhere in the text and returned a region, which made it a permissive
      // fallback that undid resolveRegion's deliberate nulls. Its unambiguous
      // county/corridor terms now live in REGION_AREAS; resolveRegion is the single
      // source of truth. Do not reintroduce a bare-keyword fallback here.

      // Simple industrial relevance check
      const isLikelyIndustrial = useCallback((text) => {
        if (!text) return true; // assume relevant if no text
        const t = text.toLowerCase();
        const industrialTerms = /\b(warehouse|industrial|logistics|distribution|fulfillment|cold storage|last[ -]mile|manufacturing|flex space|truck terminal|cross[ -]dock|supply chain|freight|3pl|data center|speculative development|spec dev|bulk warehouse)\b/;
        const nonIndustrialTerms = /\b(retail|restaurant|hotel|hospitality|multifamily|apartment|condo|residential|office lease|coworking|medical office|senior living|student housing|wine bar|brewery|spa|salon|gym|fitness|yoga|art gallery|museum|theater|concert|festival|parade)\b/;
        if (nonIndustrialTerms.test(t) && !industrialTerms.test(t)) return false;
        return true;
      }, []);

      // Normalize title for dedup. Strip ANY trailing " - Publisher" suffix
      // (Google News pattern) so "$100M ... - Yahoo Finance" and
      // "$100M ... - NJ.com" collapse to the same normalized form.
      const normalizeForDedup = useCallback((title) => {
        if (!title) return '';
        return title.toLowerCase()
          // Strip generic trailing publisher suffix: " - Foo Bar" (Google News style)
          .replace(/\s+[-–—|]\s+[a-z0-9 .&'-]{1,50}$/i, '')
          // Also strip "N.J." / "Monmouth County" variants so cross-source dupes collapse
          .replace(/\bn\.j\.|new jersey\b/gi, 'nj')
          .replace(/\bmonmouth county|monmouth\b/gi, 'monmouth')
          .replace(/[^a-z0-9\s]/g, '')
          .replace(/\s+/g, ' ')
          .trim();
      }, []);

      // Fetch and process articles for preview panel
      const loadPreviewArticles = useCallback(async () => {
        setArticlePanelLoading(true);
        try {
          const res = await fetch('feed.json');
          if (!res.ok) throw new Error('Failed to fetch feed.json');
          const data = await res.json();
          const rawItems = data.items || [];

          // Parse into a simple format
          const articles = rawItems.map(item => {
            let authorName = '';
            if (item.author) {
              authorName = typeof item.author === 'string' ? item.author : (item.author.name || '');
            }
            // Use shared publisher resolver so badge shows "CoStar" not "Google News CoStar Industrial".
            const sourceName = getPublisherName(item) || authorName || 'Unknown';
            const title = item.title || 'Untitled';
            const description = item.content_text || item.content_html || item.summary || '';
            // Feed descriptions often end with the source appended as bare words
            // ("... L&B ROI-NJ", "... north of Tampa CoStar"). Strip that tail for
            // DISPLAY only, and only when it matches the resolved publisher, so a
            // publisher named mid-sentence is preserved. The feed item is not
            // mutated - `description` above stays the canonical text and is what
            // region/industrial classification below continues to read.
            const displayDescription = cleanTrailingPublisher(description, sourceName);
            const combinedText = title + ' ' + description;
            // resolveRegion is AUTHORITATIVE. The old detectRegion is no longer
            // chained after it: that fallback resurrected exactly the nulls this
            // resolver returns on purpose. An article naming Florida and
            // Massachusetts with no locative relation is genuinely unresolved, and
            // detectRegion would have called it FL on the bare word 'florida'.
            // Its unambiguous county/corridor terms are ported into REGION_AREAS.
            const region = resolveRegion(item, combinedText);
            const industrial = isLikelyIndustrial(combinedText);

            return {
              id: item.id,
              title,
              url: item.url || '',
              description: displayDescription.substring(0, 200),
              source: sourceName,
              category: item.category || 'relevant',
              pubDate: item.date_published || '',
              region,
              industrial,
              feedName: item._source?.feedName || authorName || '',
              tags: item.tags || []
            };
          });

          // Apply timeframe filter
          const days = parseInt(timeframe, 10) || 1;
          const cutoff = new Date(Date.now() - days * 24 * 60 * 60 * 1000);
          const recent = articles.filter(a => {
            if (!a.pubDate) return true;
            return new Date(a.pubDate) >= cutoff;
          });

          setPreviewArticles(recent);
          setShowArticlePanel(true);
          setRemovedIds(new Set());
          setArticleFeedback({});
          setShowRejectMenu(null);
        } catch (e) {
          console.error('Error loading preview articles:', e);
          alert('Failed to load articles for preview.');
        } finally {
          setArticlePanelLoading(false);
        }
      }, [timeframe, isLikelyIndustrial]);

      // Apply filters and compute grouped/filtered articles
      const filteredGrouped = useMemo(() => {
        if (!previewArticles) return null;

        let filtered = previewArticles;

        // Region filter: only NJ, PA, FL
        // Region filter FAILS CLOSED: only an explicitly detected NJ / PA / FL
        // region passes. region === null means 'we could not tell', which is NOT
        // evidence of being in-region - it previously passed, so Milpitas CA and
        // Lexington KY survived the filter. Unknown is NOT relabelled as NJ/PA/FL;
        // it is simply excluded while the filter is on.
        if (filters.region) {
          filtered = filtered.filter(a => a.region === 'NJ' || a.region === 'PA' || a.region === 'FL');
        }

        // Industrial filter
        if (filters.industrial) {
          filtered = filtered.filter(a => a.industrial);
        }

        // Dedup by normalized title
        if (filters.dedup) {
          const seen = new Set();
          filtered = filtered.filter(a => {
            const norm = normalizeForDedup(a.title);
            if (seen.has(norm)) return false;
            seen.add(norm);
            return true;
          });
        }

        // Group by category
        // Category routing FAILS CLOSED. Previously any unrecognised category -
        // including 'exclude' - was silently promoted into Relevant. Now:
        //   'exclude'        -> dropped entirely
        //   unknown/missing  -> a separate `unknown` diagnostic bucket, never Relevant
        const groups = { relevant: [], transactions: [], availabilities: [], people: [], unknown: [] };
        for (const a of filtered) {
          if (a.category === 'exclude') continue;
          const cat = Object.prototype.hasOwnProperty.call(groups, a.category) && a.category !== 'unknown'
            ? a.category : 'unknown';
          groups[cat].push(a);
        }

        return groups;
      }, [previewArticles, filters, normalizeForDedup]);

      // Count filtered-out articles
      const filterStats = useMemo(() => {
        if (!previewArticles || !filteredGrouped) return { total: 0, shown: 0, removed: 0 };
        const allFiltered = Object.values(filteredGrouped).flat();
        const shown = allFiltered.filter(a => !removedIds.has(a.id));
        return {
          total: previewArticles.length,
          shown: shown.length,
          filtered: previewArticles.length - allFiltered.length,
          removed: removedIds.size
        };
      }, [previewArticles, filteredGrouped, removedIds]);

      const handleRemoveArticle = useCallback((id) => {
        setRemovedIds(prev => new Set([...prev, id]));
      }, []);

      const handleRestoreArticle = useCallback((id) => {
        setRemovedIds(prev => {
          const next = new Set(prev);
          next.delete(id);
          return next;
        });
      }, []);

      // Phase 2: Feedback handlers
      const rejectionReasons = [
        { label: 'Not Relevant', value: 'not_relevant' },
        { label: 'Wrong Region', value: 'wrong_region' },
        { label: 'Duplicate', value: 'duplicate' },
        { label: 'Old News', value: 'old_news' },
        { label: 'Not CRE Related', value: 'not_cre' },
        { label: 'Bad Description', value: 'bad_description' },
        { label: 'Other', value: 'other' }
      ];

      const buildFeedbackEntry = useCallback((article, action, reason, section) => {
        const normTitle = (article.title || '').toLowerCase()
          .replace(/\s*[-\u2013\u2014|]\s*(costar|globest|msn|yahoo|bisnow|commercialsearch|rebusinessonline|connect cre|the business journals|commercial observer|supply chain dive|freightwaves|real estate nj|wsj|loopnet).*$/i, '')
          .replace(/^news\s*\|\s*/i, '')
          .replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();
        return {
          articleId: article.id,
          title: article.title,
          normalizedTitle: normTitle,
          action: action,
          reason: reason || null,
          section: section || article.category || 'relevant',
          source: article.source || '',
          date: new Date().toISOString().split('T')[0],
          user: WoodmontUtils.getUserId() || 'unknown'
        };
      }, []);

      const handleApproveArticle = useCallback((article, section) => {
        setArticleFeedback(prev => ({
          ...prev,
          [article.id]: { action: 'approved', reason: null }
        }));
        setShowRejectMenu(null);
        // Sync feedback to GitHub
        const entry = buildFeedbackEntry(article, 'approved', null, section);
        WoodmontUtils.syncFeedbackToGitHub(entry).then(result => {
          if (!result.ok) console.warn('Feedback sync failed:', result.reason);
        });
      }, [buildFeedbackEntry]);

      const handleRejectArticle = useCallback((article, reason, section) => {
        setArticleFeedback(prev => ({
          ...prev,
          [article.id]: { action: 'rejected', reason: reason }
        }));
        setShowRejectMenu(null);
        // Sync feedback to GitHub
        const entry = buildFeedbackEntry(article, 'rejected', reason, section);
        WoodmontUtils.syncFeedbackToGitHub(entry).then(result => {
          if (!result.ok) console.warn('Feedback sync failed:', result.reason);
        });
        // Also add to excluded-articles.json
        WoodmontUtils.syncExcludeToGitHub(article.id, article.url, article.title).then(result => {
          if (!result.ok && result.reason !== 'already_excluded') console.warn('Exclude sync failed:', result.reason);
        });
      }, [buildFeedbackEntry]);

      const downloadNewsletter = useCallback(async () => {
        if (!html) return;
        
        try {
          // Create a temporary container
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = html;
          tempDiv.style.width = '210mm'; // A4 width
          tempDiv.style.padding = '20mm';
          tempDiv.style.backgroundColor = '#ffffff';
          tempDiv.style.position = 'absolute';
          tempDiv.style.left = '-9999px';
          tempDiv.style.top = '0';
          document.body.appendChild(tempDiv);
          
          // Wait for images to load
          const images = tempDiv.getElementsByTagName('img');
          await Promise.all(Array.from(images).map(img => {
            if (img.complete) return Promise.resolve();
            return new Promise((resolve, reject) => {
              img.onload = resolve;
              img.onerror = resolve; // Continue even if image fails
              setTimeout(resolve, 3000); // Timeout after 3 seconds
            });
          }));
          
          // Generate canvas
          const canvas = await html2canvas(tempDiv, {
            scale: 2,
            useCORS: true,
            allowTaint: false,
            backgroundColor: '#ffffff',
            width: tempDiv.scrollWidth,
            height: tempDiv.scrollHeight,
            windowWidth: tempDiv.scrollWidth,
            windowHeight: tempDiv.scrollHeight
          });

          // Remove temporary container
          document.body.removeChild(tempDiv);
          
          // Create PDF
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: 'a4'
          });

          const imgData = canvas.toDataURL('image/png');
          const pdfWidth = pdf.internal.pageSize.getWidth();
          const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
          
          // Add image to PDF, handling multi-page if needed
          let heightLeft = pdfHeight;
          let position = 0;
          
          pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, pdfHeight);
          heightLeft -= pdf.internal.pageSize.getHeight();
          
          while (heightLeft >= 0) {
            position = heightLeft - pdfHeight;
            pdf.addPage();
            pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, pdfHeight);
            heightLeft -= pdf.internal.pageSize.getHeight();
          }
          
          // Save PDF
          const date = new Date().toISOString().split('T')[0];
          pdf.save(`industrial-newsletter-${date}.pdf`);
        } catch (error) {
          console.error('Error generating PDF:', error);
          alert('Error generating PDF. Please try again.');
        }
      }, [html]);

      if (loading) {
        return (
          <div className="max-w-6xl mx-auto px-4 pb-12">
            <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm p-8 animate-pulse">
              <div className="h-8 bg-slate-200 dark:bg-slate-700 rounded w-1/3 mb-6"></div>
              <div className="space-y-4">
                <div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-full"></div>
                <div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-5/6"></div>
                <div className="h-4 bg-slate-200 dark:bg-slate-700 rounded w-4/5"></div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-6xl mx-auto px-4 pb-12">
          <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm p-6 mb-6">
            <div className="flex flex-wrap items-center gap-4 justify-between">
              <div className="flex items-center gap-4">
                <h2 className="text-xl font-semibold text-slate-900 dark:text-slate-100">📧 Newsletter Generator</h2>
                {generated && (
                  <span className="px-3 py-1 bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300 rounded-full">
                    ✓ Generated
                  </span>
                )}
                {(() => {
                  try {
                    const rp = getRawPicks();
                    const cnt = Object.keys(rp).length;
                    if (cnt > 0) return (
                      <span className="flex items-center gap-2">
                        <span className="px-3 py-1 bg-orange-100 dark:bg-orange-900 text-orange-700 dark:text-orange-300 rounded-full text-sm">
                          {cnt} raw pick{cnt !== 1 ? 's' : ''} ready
                        </span>
                        <button onClick={() => { clearRawPicks(); window.location.reload(); }}
                          className="text-xs text-red-500 hover:underline">Clear</button>
                      </span>
                    );
                    return null;
                  } catch { return null; }
                })()}
              </div>
              
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2">
                  <label className="text-sm text-slate-600 dark:text-slate-400">Timeframe:</label>
                  <select
                    className="rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-1 text-sm focus:ring-2 focus:ring-blue-300 dark:focus:ring-blue-600 outline-none text-slate-900 dark:text-white"
                    value={timeframe}
                    onChange={(e) => setTimeframe(e.target.value)}
                  >
                    <option value="1">Last 24 hours</option>
                    <option value="2">Last 48 hours</option>
                    <option value="3">Last 3 days</option>
                    <option value="7">Last 7 days</option>
                    <option value="14">Last 14 days</option>
                    <option value="30">Last 30 days</option>
                    <option value="90">Last 90 days</option>
                  </select>
                </div>

                <div className="flex items-center gap-2">
                  <label className="text-sm text-slate-600 dark:text-slate-400">Theme:</label>
                  <select
                    className="rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-1 text-sm focus:ring-2 focus:ring-blue-300 dark:focus:ring-blue-600 outline-none text-slate-900 dark:text-white"
                    value={theme}
                    onChange={(e) => setTheme(e.target.value)}
                  >
                    <option value="work">Work (Clean & Professional)</option>
                    <option value="capital-markets">Capital Markets Preview</option>
                    <option value="default">Default (Colorful)</option>
                    <option value="goth">Executive Dark</option>
                  </select>
                </div>

                {/* Capital Markets sandbox controls — preview-only (2026-09-18) */}
                {theme === 'capital-markets' && (
                  <>
                    <div className="flex items-center gap-2">
                      <label className="text-sm text-slate-600 dark:text-slate-400">As-of:</label>
                      <input
                        type="date"
                        value={cmAsOfDate}
                        onChange={(e) => setCmAsOfDate(e.target.value)}
                        className="rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-1 text-sm outline-none text-slate-900 dark:text-white"
                        title="Simulate a past date using articles already loaded in this page"
                      />
                    </div>
                    <div className="flex items-center gap-2">
                      <label className="text-sm text-slate-600 dark:text-slate-400">Lookback:</label>
                      <select
                        className="rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-1 text-sm outline-none text-slate-900 dark:text-white"

                        onChange={(e) => setCmLookback(e.target.value)}

                        <option value="24">24 hours</option>
                        <option value="72">72 hours</option>
                        <option value="168">7 days</option>
                        <option value="720">30 days</option>
                      </select>
                    </div>
                    {/* Competitor watchlist — browser-local only. FileReader
                        parses in memory; nothing is uploaded, stored or logged. */}
                    <div className="flex items-center gap-2">
                      <label className="text-sm text-slate-600 dark:text-slate-400">Watchlist:</label>
                      <input
                        type="file"
                        accept=".csv,text/csv"
                        onChange={(e) => {
                          const f = e.target.files && e.target.files[0];
                          if (!f) return;
                          const reader = new FileReader();
                          reader.onload = (ev) => {
                            try {
                              const rows = cmParseCSV(String(ev.target.result || ''));
                              setCmWatchlist(rows);   // memory only — never persisted
                            } catch (err) {
                              // Deliberately does not log file contents.
                              console.warn('Watchlist parse failed (contents not logged)');
                              setCmWatchlist(null);
                            }
                          };
                          reader.readAsText(f);
                        }}
                        className="text-xs text-slate-600 dark:text-slate-300 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-slate-100 dark:file:bg-slate-700 file:text-slate-700 dark:file:text-slate-200"
                        title="CSV stays in this browser tab only — not uploaded, not stored, cleared on refresh"
                      />
                      <span className="text-xs text-slate-500 dark:text-slate-400">
                        {cmWatchlist && cmWatchlist.length
                          ? `${cmWatchlist.length} companies loaded (memory only)`
                          : 'No competitor watchlist loaded'}
                      </span>
                      {cmWatchlist && cmWatchlist.length > 0 && (
                        <button
                          onClick={() => setCmWatchlist(null)}
                          className="px-2 py-1 text-xs bg-slate-200 dark:bg-slate-600 rounded"
                        >Clear</button>
                      )}
                    </div>
                  </>
                )}

                <button
                  onClick={onGenerate}
                  className="px-4 py-2 bg-blue-500 text-white rounded-lg font-medium hover:bg-blue-600 transition-colors"
                >
                  Generate Newsletter
                </button>

                <button
                  onClick={loadPreviewArticles}
                  disabled={articlePanelLoading}
                  className="px-4 py-2 bg-amber-500 text-white rounded-lg font-medium hover:bg-amber-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center gap-2"
                >
                  {articlePanelLoading ? (
                    <>
                      <div className="animate-spin w-4 h-4 border-2 border-white border-t-transparent rounded-full"></div>
                      Loading...
                    </>
                  ) : (
                    <>Preview Articles</>
                  )}
                </button>

                <button
                  onClick={onFetchFeedHealth}
                  disabled={feedHealthLoading}
                  className="px-4 py-2 bg-purple-500 text-white rounded-lg font-medium hover:bg-purple-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center gap-2"
                >
                  {feedHealthLoading ? (
                    <>
                      <div className="animate-spin w-4 h-4 border-2 border-white border-t-transparent rounded-full"></div>
                      Loading...
                    </>
                  ) : (
                    <>📊 Feed Health</>
                  )}
                </button>
                
                {generated && (
                  <>
                    <button
                      onClick={downloadNewsletter}
                      className="px-4 py-2 bg-[#0B223F] text-white rounded-lg font-medium hover:bg-[#16406b] transition-colors"
                    >
                      📄 Download PDF
                    </button>
                    {theme === 'capital-markets' && (
                      <span className="px-3 py-2 rounded-lg text-sm font-bold bg-amber-100 text-amber-800 border-2 border-amber-400">
                        PREVIEW ONLY — NOT PRODUCTION
                      </span>
                    )}
                    {/* Send Email is withheld for the Capital Markets sandbox: it is a
                        preview profile and must never reach the production send path. */}
                    {!IS_STATIC && theme !== 'capital-markets' && (
                    <button
                      onClick={onSendEmail}
                      disabled={emailLoading}
                      className="px-4 py-2 bg-blue-500 text-white rounded-lg font-medium hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center gap-2"
                    >
                      {emailLoading ? (
                        <>
                          <div className="animate-spin w-4 h-4 border-2 border-white border-t-transparent rounded-full"></div>
                          Sending...
                        </>
                      ) : (
                        <>📧 Send Email</>
                      )}
                    </button>
                    )}
                <button
                      onClick={onClear}
                      className="px-4 py-2 bg-slate-500 text-white rounded-lg font-medium hover:bg-slate-600 transition-colors"
                    >
                      Clear
                </button>
                  </>
            )}
              </div>
            </div>
          </div>

          {/* Article Preview Panel (Phase 1) */}
          {showArticlePanel && filteredGrouped && (
            <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm overflow-hidden mb-6">
              <div className="p-6 border-b border-slate-200 dark:border-slate-700">
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-3">
                    <h3 className="text-lg font-semibold text-slate-900 dark:text-slate-100">Article Preview</h3>
                    <span className="text-sm text-slate-500 dark:text-slate-400">
                      {filterStats.shown} shown / {filterStats.total} total
                      {filterStats.filtered > 0 && (
                        <span className="ml-1 text-amber-600 dark:text-amber-400">({filterStats.filtered} filtered out)</span>
                      )}
                      {filterStats.removed > 0 && (
                        <span className="ml-1 text-red-500">({filterStats.removed} removed)</span>
                      )}
                    </span>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={loadPreviewArticles}
                      className="text-sm text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300"
                    >
                      Refresh
                    </button>
                    <button
                      onClick={() => setShowArticlePanel(false)}
                      className="text-sm text-slate-500 hover:text-slate-700 dark:hover:text-slate-300"
                    >
                      Close
                    </button>
                  </div>
                </div>

                {/* Section summary bar */}
                <div className="flex flex-wrap gap-3 mb-4 text-sm">
                  {['relevant', 'transactions', 'availabilities', 'people', 'unknown'].map(cat => {
                    const items = (filteredGrouped[cat] || []).filter(a => !removedIds.has(a.id));
                    const label = cat === 'unknown'
                      ? 'Uncategorized (diagnostic — not sent as Relevant)'
                      : cat.charAt(0).toUpperCase() + cat.slice(1);
                    return (
                      <span key={cat} className="px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium">
                        {label} ({items.length})
                      </span>
                    );
                  })}
                </div>

                {/* Filter toggles */}
                <div className="flex flex-wrap gap-4 text-sm">
                  <label className="flex items-center gap-2 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={filters.region}
                      onChange={(e) => setFilters(prev => ({ ...prev, region: e.target.checked }))}
                      className="rounded border-slate-300 text-blue-500 focus:ring-blue-300"
                    />
                    <span className="text-slate-700 dark:text-slate-300">Region filter (NJ/PA/FL)</span>
                  </label>
                  <label className="flex items-center gap-2 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={filters.industrial}
                      onChange={(e) => setFilters(prev => ({ ...prev, industrial: e.target.checked }))}
                      className="rounded border-slate-300 text-blue-500 focus:ring-blue-300"
                    />
                    <span className="text-slate-700 dark:text-slate-300">Industrial only</span>
                  </label>
                  <label className="flex items-center gap-2 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={filters.dedup}
                      onChange={(e) => setFilters(prev => ({ ...prev, dedup: e.target.checked }))}
                      className="rounded border-slate-300 text-blue-500 focus:ring-blue-300"
                    />
                    <span className="text-slate-700 dark:text-slate-300">Deduplicate</span>
                  </label>
                </div>
              </div>

              {/* Article sections */}
              <div className="p-6 max-h-[600px] overflow-y-auto">
                {['relevant', 'transactions', 'availabilities', 'people', 'unknown'].map(cat => {
                  const allInCat = filteredGrouped[cat] || [];
                  const activeArticles = allInCat.filter(a => !removedIds.has(a.id));
                  const removedArticles = allInCat.filter(a => removedIds.has(a.id));
                  if (allInCat.length === 0) return null;
                    const label = cat === 'unknown'
                      ? 'Uncategorized (diagnostic — not sent as Relevant)'
                      : cat.charAt(0).toUpperCase() + cat.slice(1);

                  return (
                    <div key={cat} className="mb-6 last:mb-0">
                      <h4 className="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3 border-b border-slate-200 dark:border-slate-700 pb-2">
                        {label} ({activeArticles.length})
                      </h4>

                      {/* Active articles */}
                      {activeArticles.map(article => {
                        const fb = articleFeedback[article.id];
                        const isApproved = fb && fb.action === 'approved';
                        const isRejected = fb && fb.action === 'rejected';
                        const borderClass = isApproved ? 'border-l-4 border-l-blue-500' : isRejected ? 'border-l-4 border-l-red-500 opacity-50' : '';

                        return (
                        <div key={article.id} className={`flex items-start gap-3 py-2 px-3 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700/50 group ${borderClass}`}>
                          {/* Feedback buttons */}
                          <div className="mt-1 flex-shrink-0 flex flex-col gap-1">
                            <button
                              onClick={() => handleApproveArticle(article, cat)}
                              className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold transition-all ${
                                isApproved
                                  ? 'bg-[#0B223F] text-white shadow-sm'
                                  : 'bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 hover:bg-blue-200 dark:hover:bg-blue-800 opacity-50 group-hover:opacity-100'
                              }`}
                              title="Approve article"
                            >
                              {'\u2713'}
                            </button>
                            <div className="relative">
                              <button
                                onClick={() => setShowRejectMenu(showRejectMenu === article.id ? null : article.id)}
                                className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold transition-all ${
                                  isRejected
                                    ? 'bg-red-500 text-white shadow-sm'
                                    : 'bg-red-100 dark:bg-red-900/50 text-red-600 dark:text-red-400 hover:bg-red-200 dark:hover:bg-red-800 opacity-50 group-hover:opacity-100'
                                }`}
                                title="Reject article"
                              >
                                {'\u2717'}
                              </button>
                              {showRejectMenu === article.id && (
                                <div className="absolute left-8 top-0 w-48 bg-white dark:bg-slate-800 rounded-lg shadow-xl border border-slate-200 dark:border-slate-600 z-50 overflow-hidden">
                                  <div className="py-1">
                                    <div className="px-3 py-2 text-xs font-semibold text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-700">

                                    </div>

                                      <button
                                        key={reason.value}
                                        onClick={(e) => {
                                          e.stopPropagation();
                                          handleRejectArticle(article, reason.label, cat);
                                        }}
                                        className="w-full text-left px-3 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-red-50 dark:hover:bg-red-900/30 hover:text-red-600 dark:hover:text-red-400 transition-colors"
                                      >
                                        {reason.label}
                                      </button>
                                    ))}
                                  </div>
                                </div>
                              )}
                            </div>
                            <button
                              onClick={() => handleRemoveArticle(article.id)}
                              className="w-6 h-6 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-600 flex items-center justify-center text-sm font-bold opacity-50 group-hover:opacity-100 transition-opacity"
                              title="Remove from preview"
                            >
                              -
                            </button>
                          </div>

                                className={`text-sm font-medium hover:text-blue-600 dark:hover:text-blue-400 truncate max-w-md ${

                                }`}>
                                {article.title}
                              </a>
                              {isApproved && (
                                <span className="px-1.5 py-0.5 rounded text-xs font-medium bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300">
                                  {'\u2713'} Approved
                                </span>
                              )}
                              {isRejected && (
                                <span className="px-1.5 py-0.5 rounded text-xs font-medium bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-300">

                                  {article.region}
                                </span>

                            </div>
                          ))}

                      )}
                    </div>

          {html && (
            <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm overflow-hidden">
              <div className="p-6 border-b border-slate-200 dark:border-slate-700">
            <div className="flex items-center justify-between">

                    className="w-full h-96 border border-slate-200 dark:border-slate-700 rounded-lg"

          {/* Feed Health Report */}
          {showFeedHealth && feedHealthReport && (() => {
            const rssFeeds = feedHealthReport.feeds.filter(f => f.type !== 'scraper');
            const scraperFeeds = feedHealthReport.feeds.filter(f => f.type === 'scraper');
            const rssSummary = {
              ok: rssFeeds.filter(f => f.status === 'ok').length,
              failed: rssFeeds.filter(f => f.status === 'failed').length,
              fetched: rssFeeds.reduce((s, f) => s + f.fetchedRaw, 0),
              kept: rssFeeds.reduce((s, f) => s + f.keptAfterFiltering, 0)
            };
            const scraperSummary = feedHealthReport.scraperSummary || {
              total: scraperFeeds.length,
              successful: scraperFeeds.filter(f => f.status === 'ok').length,
              failed: scraperFeeds.filter(f => f.status === 'failed').length,
              articlesFetched: scraperFeeds.reduce((s, f) => s + f.fetchedRaw, 0),

            };

            const FeedTable = ({ feeds, emptyMsg }) => (
              <table className="w-full text-sm">
                <thead className="text-left border-b border-slate-200 dark:border-slate-700">

                    <th className="pb-2 font-medium text-slate-700 dark:text-slate-300 text-right">Reliability</th>

                </thead>
                <tbody>
                  {feeds.length === 0 ? (
                    <tr><td colSpan={6} className="py-4 text-center text-slate-400">{emptyMsg}</td></tr>
                  ) : feeds.map((feed, idx) => (
                    <tr key={idx} className={`border-b border-slate-100 dark:border-slate-700 ${feed.status === 'failed' ? 'bg-red-50 dark:bg-red-900/20' : ''}`}>
                      <td className="py-2">
                        <div className="font-medium text-slate-900 dark:text-slate-100">
                          {feed.name}
                          {feed.scraperStrategy && (
                            <span className="ml-2 px-1.5 py-0.5 bg-indigo-100 dark:bg-indigo-900 text-indigo-600 dark:text-indigo-300 rounded text-xs">{feed.scraperStrategy}</span>
                          )}
                        </div>
                        <div className="text-xs text-slate-500 truncate max-w-xs" title={feed.url}>{feed.url}</div>
                      </td>
                      <td className="py-2">
                        {feed.status === 'ok' ? (
                          <span className="px-2 py-1 bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300 rounded text-xs">OK</span>
                        ) : (
                          <span className="px-2 py-1 bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-300 rounded text-xs">FAILED</span>
                        )}
                      </td>
                      <td className="py-2 text-right text-slate-600 dark:text-slate-400">{feed.fetchedRaw}</td>
                      <td className="py-2 text-right text-slate-600 dark:text-slate-400">{feed.keptAfterFiltering}</td>
                      <td className="py-2 text-right">
                        {feed.successRate ? (
                          <span className={`px-2 py-1 rounded text-xs font-medium ${
                            parseInt(feed.successRate) >= 80 ? 'bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300' :
                            parseInt(feed.successRate) >= 50 ? 'bg-yellow-100 dark:bg-yellow-900 text-yellow-700 dark:text-yellow-300' :
                            'bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-300'
                          }`}>{feed.successRate}</span>
                        ) : '-'}
                      </td>
                      <td className="py-2 text-xs text-red-600 dark:text-red-400 max-w-xs truncate" title={feed.lastError || ''}>
                        {feed.lastError || '-'}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            );

            return (
            <>
            {/* Data Files */}
            <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm overflow-hidden mt-6">
              <div className="p-6 border-b border-slate-200 dark:border-slate-700">
                <h3 className="text-lg font-semibold text-slate-900 dark:text-slate-100 mb-3">Data Files</h3>
                <div className="flex flex-wrap gap-3">
                  <a
                    href="feed.json"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-4 py-2 bg-[#0B223F] text-white rounded-lg font-medium hover:bg-[#16406b] transition-colors text-sm no-underline inline-flex items-center gap-2"
                  >
                    View feed.json
