name: Newsletter Watchdog

on:
  schedule:
    # 2026-08-31: shifted -1h for the new ~7:30 AM ET delivery target.
    # Check at 7:30 AM EDT (11:30 UTC) — pipeline should be done by now
    - cron: '30 11 * * 1-5'
    # Check again at 8:00 AM EDT (12:00 UTC)
    - cron: '0 12 * * 1-5'
    # Final check at 8:30 AM EDT (12:30 UTC) — last resort before boss arrives
    - cron: '30 12 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  actions: write

jobs:
  check-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check if newsletter ran today
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const todayStart = new Date(now);
            todayStart.setUTCHours(0, 0, 0, 0);

            // Check sent-articles.json — the source of truth
            try {
              const file = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'docs/sent-articles.json'
              });
              const content = JSON.parse(Buffer.from(file.data.content, 'base64').toString());
              const today = new Date().toISOString().split('T')[0];
              // Same dedup semantics as send-only.yml: lastSendDate covers sends
              // with zero new article ids (2026-08-31 audit finding 3).
              const sentToday = content.lastSendDate === today
                || (content.sent || []).some(s => s.sentAt === today);
              if (sentToday) {
                console.log('✅ Newsletter already sent today (confirmed in sent-articles.json).');
                return;
              }
            } catch (e) {
              console.log('Could not check sent-articles.json: ' + e.message);
            }

            // Also check if send-only workflow is in progress
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'send-only.yml',
                created: `>=${todayStart.toISOString().split('T')[0]}`,
                per_page: 5
              });
              const inProgress = runs.data.workflow_runs.some(r => r.status === 'in_progress');
              if (inProgress) {
                console.log('⏳ Send workflow is currently running. No action needed.');
                return;
              }
            } catch { /* workflow might not exist */ }

            // Newsletter didn't send today — AUTO-DISPATCH the send (2026-08-31:
            // was warn-only, which nobody sees in time; this workflow already held
            // actions:write). Closes the "dead zone": if the send crons are dropped
            // while the build completed BEFORE the delivery floor, the consumed
            // workflow_run recovery event never comes back — this is the backstop.
            // Guards, both on the America/New_York wall clock so they survive DST:
            //   - never dispatch on a weekend
            //   - never dispatch before 7:30 AM ET (when EST returns in Nov, the
            //     fixed-UTC crons drift to 6:30/7:00/7:30 AM ET — without this
            //     guard the first two checks would fire an early send all winter)
            // The dispatched run still passes through send-only.yml's own dedup.
            const ny = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
            if (ny.getDay() === 0 || ny.getDay() === 6) {
              console.log('Weekend in America/New_York — watchdog stands down.');
              return;
            }
            if (ny.getHours() * 60 + ny.getMinutes() < 7 * 60 + 30) {
              console.log('Before 7:30 AM ET — too early to declare a miss; standing down until the next check.');
              return;
            }
            console.log('🚨 Newsletter did NOT send today — auto-dispatching send-only.yml');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'send-only.yml',
              ref: 'main'
            });
            core.notice('Newsletter had not sent by ' + ny.toTimeString().slice(0, 5) + ' ET — watchdog auto-dispatched send-only.yml.');
