name: Capital Markets Shadow (No Send)

on:
  workflow_run:
    workflows: ["Newsletter Pipeline (Build Only)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capital-markets-shadow
  cancel-in-progress: true

jobs:
  shadow:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Capital Markets regression suites
        run: npm run test:capital-markets

      - name: Build shadow newsletter
        run: npm run build:capital-markets-shadow

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: capital-markets-shadow-${{ github.run_id }}
          path: artifacts/capital-markets-shadow/
          retention-days: 14
          if-no-files-found: error
