name: "Send: Newsletter Only"

# SEND ONLY — reads existing feed.json and sends newsletter.
# No scraping, no RSS fetching, no heavy builds.
# Completely separate from the build workflow. Safe, fast, no double-sends.

on:
  schedule:
    # TARGET: ~7:30 AM ET delivery (2026-08-31: moved up from 8:30 per user request).
    # 7:30 AM EDT = 11:30 UTC. GitHub delays scheduled crons (~2h typical when
    # healthy), so the crons fire EARLY at 09:25-10:10 UTC; +~2h lag => ~11:30 UTC.
    # This is NOT exact/"sharp" — GitHub drift decides actual arrival. For a true
    # 7:30:00 send, use an external scheduler -> repository_dispatch (fires with
    # no lag; this workflow already accepts types: [send-newsletter]).
    # DST: cron is fixed UTC. When ET returns to EST (Nov 2026) bump +1h to
    # 10:25-11:10 UTC so delivery stays ~7:30 ET.
    # Build pipeline fires 06:55-07:55 UTC (newsletter-pipeline.yml) — lands first.
    - cron: '25 9 * * 1-5'
    - cron: '40 9 * * 1-5'
    - cron: '55 9 * * 1-5'
    - cron: '10 10 * * 1-5'
  repository_dispatch:
    types: [send-newsletter]
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Bypass dedup guard'
        required: false
        type: boolean
        default: false
  # AUTO-RECOVERY: GitHub silently drops scheduled crons under load (esp. the Monday
  # after a holiday — 2026-07-06 the send cron never fired). The build pipeline still
  # runs reliably, so we also fire the send when the build COMPLETES. This means a
  # dropped cron self-heals with no human in the loop (the whole point when you're on
  # vacation). It CANNOT double-send: the dedup guard (sentAt===today) skips this run
  # if the cron already delivered. And the build has no `push` trigger, so the send's
  # own commits can never loop back into it.
  workflow_run:
    workflows: ["Newsletter Pipeline (Build Only)"]
    types: [completed]

permissions:
  contents: write

jobs:
  send:
    # On the auto-recovery path, only proceed if the build actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: send-newsletter
      cancel-in-progress: false

    steps:
      # Dedup: check sent-articles.json FIRST
      - name: Check if already sent today
        id: dedup
        uses: actions/github-script@v7
        with:
          script: |
            if ('${{ inputs.force_send }}' === 'true') {
              core.setOutput('skip', 'false');
              console.log('Force send — bypassing dedup');
              return;
            }
            // ---- Delivery floor + weekday gate (AUTOMATED triggers only) ----
            // Applies to `schedule` and `workflow_run`: never send on a weekend, never
            // send before 7:15 AM America/New_York (target delivery ~7:30 AM ET).
            // NY wall-clock, not fixed UTC => DST-proof (replaces the old 10:30 UTC
            // workflow_run-only gate, which was 1h early, silently consumed the
            // recovery event when the build finished early — the "dead zone" — and
            // needed a manual November bump nobody would remember).
            // Deliberate triggers (workflow_dispatch, repository_dispatch — e.g. an
            // external scheduler firing at the intended minute, or a human recovery)
            // BYPASS the floor but still respect the sent-today dedup below.
            // Interplay: if GitHub cron lag ever normalizes, the 09:25-10:10 UTC
            // crons arrive before the floor and skip; the watchdog then dispatches
            // at >=7:30 ET (newsletter-watchdog.yml auto-dispatch, 2026-08-31).
            const ny = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
            const nyMinutes = ny.getHours() * 60 + ny.getMinutes();
            const FLOOR = 7 * 60 + 15; // 7:15 AM ET
            if (context.eventName === 'schedule' || context.eventName === 'workflow_run') {
              if (ny.getDay() === 0 || ny.getDay() === 6) {
                core.setOutput('skip', 'true');
                console.log('Weekend in America/New_York — no automated send.');
                return;
              }
              if (nyMinutes < FLOOR) {
                core.setOutput('skip', 'true');
                console.log(`Before the 7:15 AM ET delivery floor (NY now ${ny.getHours()}:${String(ny.getMinutes()).padStart(2, '0')}) — deferring to a later trigger or the watchdog.`);
                return;
              }
              console.log('Inside the delivery window — will send if not already sent today.');
            }
            try {
              const file = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'docs/sent-articles.json'
              });
              const content = JSON.parse(Buffer.from(file.data.content, 'base64').toString());
              const today = new Date().toISOString().split('T')[0];
              // lastSendDate is stamped on EVERY successful send; the per-entry scan
              // alone misses a send composed entirely of previously-seen ids
              // (2026-08-31 audit finding 3 — that gap allowed same-day re-sends).
              const sentToday = content.lastSendDate === today
                || (content.sent || []).some(s => s.sentAt === today);
              if (sentToday) {
                core.setOutput('skip', 'true');
                console.log('Already sent today — skipping');
                return;
              }
            } catch (e) {
              console.log('Could not check sent-articles.json: ' + e.message);
            }
            core.setOutput('skip', 'false');

      - name: Skip notice
        if: steps.dedup.outputs.skip == 'true'
        run: echo "⏭️ Newsletter already sent today."

      - name: Checkout
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.dedup.outputs.skip != 'true'
        run: npm install --prefer-offline --no-audit

      - name: Send newsletter
        if: steps.dedup.outputs.skip != 'true'
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NEWSLETTER_RECIPIENTS: ${{ secrets.NEWSLETTER_RECIPIENTS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_2 }}
          # Lets the quality scorer tell a human-dispatched send (automation failed,
          # -5) apart from a scheduled/auto-recovered one (timing penalty only).
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          echo "📧 Sending newsletter..."
          npx tsx rssfeed.ts --send-newsletter-work

      - name: Commit sent-articles
        if: steps.dedup.outputs.skip != 'true'
        # Delegated to a script so the race behavior is unit-testable. The script
        # exits nonzero if the sent-state cannot reach origin/main — that MUST
        # fail the job loudly: the email already went out, and unrecorded state
        # means later triggers duplicate-send (2026-08-31 audit findings 1-2).
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          bash .github/scripts/commit-send-state.sh

      # Also save today's top articles for Friday Week-in-Review
      - name: Save daily top articles
        if: steps.dedup.outputs.skip != 'true'
        run: |
          node -e "
          const fs = require('fs');
          const feed = JSON.parse(fs.readFileSync('docs/feed.json', 'utf-8'));
          const sent = JSON.parse(fs.readFileSync('docs/sent-articles.json', 'utf-8'));
          const today = new Date().toISOString().split('T')[0];
          const todayIds = new Set((sent.sent || []).filter(s => s.sentAt === today).map(s => s.id));
          const todaySent = feed.items.filter(i => todayIds.has(i.id));
          // Load or create weekly file
          let weekly = { week: {}, updatedAt: '' };
          try { weekly = JSON.parse(fs.readFileSync('docs/weekly-top-articles.json', 'utf-8')); } catch {}
          weekly.week[today] = todaySent.map(a => ({
            id: a.id, title: a.title, url: a.url, category: a.category,
            source: (a._source || {}).website || '',
            link: a.url || a.link || '',
            description: (a.content_text || a.description || a.summary || '').substring(0, 350),
            date_published: a.date_published || a.pubDate || today,
            region: (a.tags || []).find(t => t.length <= 5) || ''
          }));
          // Keep only this week (last 5 weekdays)
          const keys = Object.keys(weekly.week).sort().reverse().slice(0, 5);
          const trimmed = {};
          keys.forEach(k => trimmed[k] = weekly.week[k]);
          weekly.week = trimmed;
          weekly.updatedAt = new Date().toISOString();
          fs.writeFileSync('docs/weekly-top-articles.json', JSON.stringify(weekly, null, 2));
          console.log('Saved ' + todaySent.length + ' articles for ' + today);
          "
          git add docs/weekly-top-articles.json
          git diff --staged --quiet || git commit -m "📊 Daily top articles - $(date -u +'%Y-%m-%d')" && git push || true

      # Update pipeline status on the website (no email, no webhook)
      - name: Update pipeline status
        if: steps.dedup.outputs.skip != 'true'
        run: |
          ARTICLE_COUNT=$(node -e "const s=JSON.parse(require('fs').readFileSync('docs/sent-articles.json','utf-8'));const t=s.sent.filter(x=>x.sentAt===new Date().toISOString().split('T')[0]).length;console.log(t)")
          node -e "
          const fs = require('fs');
          const status = {
            lastSent: new Date().toISOString(),
            date: new Date().toISOString().split('T')[0],
            articleCount: ${ARTICLE_COUNT},
            status: 'success',
            runId: '${{ github.run_id }}',
            runUrl: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          };
          fs.writeFileSync('docs/pipeline-status.json', JSON.stringify(status, null, 2));
          "
          git add docs/pipeline-status.json
          git diff --staged --quiet || git commit --amend --no-edit && git push --force-with-lease || true

      - name: Report
        if: success() && steps.dedup.outputs.skip != 'true'
        run: echo "✅ Newsletter sent!"
