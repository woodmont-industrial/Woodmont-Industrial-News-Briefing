name: Verify next People briefing without delivery

on:
  push:
    branches: [validation/rosen-2026-10-22]

permissions:
  contents: read

jobs:
  replay:
    name: Frozen October 22 People replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: '1'
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Replay both inclusion routes with all delivery blocked
        run: node --import tsx scripts/verify-next-people.mjs
      - name: Confirm repository state was not modified
        run: git diff --exit-code -- docs
