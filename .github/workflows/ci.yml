name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # TypeScript type checking and linting
  typecheck:
    runs-on: ubuntu-latest
    name: TypeScript Check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript compile check
        run: npx tsc --noEmit --skipLibCheck || echo "TypeScript check completed with warnings"
        continue-on-error: true

      - name: Test region and asset evidence
        run: node --import tsx src/server/region-evidence.test.ts

      - name: Test People personnel detection
        run: |
          node --import tsx src/server/people-join.test.ts
          node --import tsx src/server/people-rescue.test.ts
          node --import tsx src/server/people-corporate-verb.test.ts

      - name: Test engineering changelog datasets
        run: node scripts/engineering-changelog.test.mjs

  # Build verification
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build static files
        run: npm run build-static
        timeout-minutes: 10
        continue-on-error: true

      - name: Verify build output
        run: |
          if [ -d "docs" ]; then
            echo "✅ Build completed successfully"
            ls -la docs/
          else
            echo "⚠️ docs directory not created (may be expected on first run)"
          fi
        continue-on-error: true

  # Python tests
  python-tests:
    runs-on: ubuntu-latest
    name: Python Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Python tests
        run: |
          python -m pytest test_*.py -v --tb=short || echo "Tests completed with some failures"
        continue-on-error: true

  # Security scan
  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=high || echo "Security vulnerabilities found (non-blocking)"
        continue-on-error: true

      - name: Check for secrets
        run: |
          # Check for potential secrets in code
          if grep -rE "(api_key|secret|password|token)\s*=\s*['\"][^'\"]+['\"]" src/ --include="*.ts" --include="*.js" 2>/dev/null; then
            echo "⚠️ Potential hardcoded secrets found"
          else
            echo "✅ No obvious hardcoded secrets found"
          fi
        continue-on-error: true

  # Geography drift check
  geography-check:
    runs-on: ubuntu-latest
    name: Geography Drift Check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for TX/NY in target region lists
        run: |
          echo "Checking for geography drift..."
          FAIL=0
          # TARGET_REGIONS should only have NJ/PA/FL entries
          if grep -n "TARGET_REGIONS" src/shared/region-data.ts | grep -iE "'TX'|'NY'|TEXAS|NEW YORK" | grep -v EXCLUDE | grep -v "//"; then
            echo "❌ Found TX or NY in TARGET_REGIONS"
            FAIL=1
          fi
          # Check frontend region selector
          if grep -n "regions.*=" docs/index.html frontend/config.js 2>/dev/null | grep -iE '"TX"|"NY"'; then
            echo "❌ Found TX or NY in frontend region selector"
            FAIL=1
          fi
          # Check for duplicate feed URLs
          node -e "
          const feeds = require('./src/feeds/feeds.json');
          const urls = {};
          let dupes = 0;
          feeds.filter(f => f.enabled !== false).forEach(f => {
            if (urls[f.url]) { console.log('❌ Duplicate feed URL: ' + f.name + ' and ' + urls[f.url]); dupes++; }
            else urls[f.url] = f.name;
          });
          if (dupes > 0) process.exit(1);
          console.log('✅ No duplicate feed URLs');
          " || FAIL=1
          if [ "$FAIL" -eq 0 ]; then
            echo "✅ No geography drift detected"
          else
            echo "⚠️ Geography drift issues found (non-blocking)"
          fi
        continue-on-error: true

  # Watchlist data-minimization guard. The ownership workbook stays outside the
  # repository, and the published projection must keep to the matcher fields.
  # These tests previously ran only in the shadow/canary workflows, so a pull
  # request could reintroduce the data unnoticed. BLOCKING on purpose.
  watchlist-privacy:
    runs-on: ubuntu-latest
    name: Watchlist Privacy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Source workbook must not be committed
        run: |
          if git ls-files --error-unmatch data/capital-markets/institutional-ownership-nnj.xlsx >/dev/null 2>&1; then
            echo "::error::The ownership workbook must not be committed; keep it outside the repository."
            exit 1
          fi
          echo "✅ Ownership workbook is not in the tree"

      - name: Published projection keeps to the matcher fields
        run: npm run test:capital-markets

      - name: Watchlist terms have not spread beyond the authorized file
        run: npm run validate:cm-watchlist-privacy

  ai-compatibility:
    name: AI Request Compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: node --import tsx src/filter/ai-provider.test.ts
      - run: node --import tsx src/filter/summary-quantities.test.ts
      - run: node --import tsx src/server/availability-routing.test.ts
      - run: node --import tsx src/server/listing-event.test.ts
      - run: node --import tsx src/server/newsletter-content.test.ts
      - run: node --import tsx src/server/newsletter-region-score.test.ts
      - run: node --import tsx src/server/quality-method.test.ts
      - name: Test send-state publication in disposable local repositories
        run: bash .github/scripts/commit-send-state.test.sh
      - run: node --import tsx src/server/newsletter-geography.test.ts
      - run: node --import tsx src/build/newsletter-facts.test.ts
      - run: node --import tsx src/filter/editorial-review.test.ts
      - run: node --import tsx src/server/relevant-editorial.test.ts
      - run: node --import tsx src/server/newsletter-backfill.test.ts
      - run: node --import tsx src/server/newsletter-summary-render.test.ts

      - name: Replay three archived sends without delivery
        run: node --import tsx scripts/replay-newsletter-quality.ts
      - name: Verify two approved public releases through the real loader
        if: >-
          github.event_name == 'pull_request' && github.head_ref == 'fix/newsletter-reader-quality' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: node --import tsx scripts/replay-newsletter-quality.ts --public-facts

  ai-provider-smoke:
    name: AI Provider Smoke Test
    # The initial repair is verified with existing secrets on this same-repo PR.
    # Later checks are manually requested through this existing CI workflow.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref == 'fix/ai-model-recovery' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Verify each provider without building or sending a newsletter
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: node --import tsx scripts/ai-provider-smoke.ts
      - name: Upload compatibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-provider-smoke-${{ github.run_id }}
          path: artifacts/ai-provider-smoke/result.json
          retention-days: 14
          if-no-files-found: error

  # Summary job - always runs
  ci-summary:
    runs-on: ubuntu-latest
    name: CI Summary
    needs: [typecheck, build, python-tests, security-scan, geography-check, watchlist-privacy, ai-compatibility, ai-provider-smoke]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## CI Pipeline Results"
          echo ""
          echo "| Job | Status |"
          echo "|-----|--------|"
          echo "| TypeScript Check | ${{ needs.typecheck.result }} |"
          echo "| Build | ${{ needs.build.result }} |"
          echo "| Python Tests | ${{ needs.python-tests.result }} |"
          echo "| Security Scan | ${{ needs.security-scan.result }} |"
          echo "| Geography Check | ${{ needs.geography-check.result }} |"
          echo "| Watchlist Privacy | ${{ needs.watchlist-privacy.result }} |"
          echo "| AI Request Compatibility | ${{ needs.ai-compatibility.result }} |"
          echo "| AI Provider Smoke Test | ${{ needs.ai-provider-smoke.result }} |"
          echo ""
          echo "Note: Jobs with 'continue-on-error' may show as successful even with warnings."
