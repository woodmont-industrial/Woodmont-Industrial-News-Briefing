name: Toggle AI Filtering

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Enable or Disable AI filtering'
        required: true
        default: 'enable'
        type: choice
        options:
          - enable
          - disable

permissions:
  contents: read

jobs:
  toggle-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Direct workflow mutation is retired
        run: |
          echo "::error::This workflow no longer edits workflow files or pushes directly to main."
          echo "Requested state: ${{ inputs.action }}"
          echo "Change AI filtering through a reviewed pull request instead."
          exit 1
